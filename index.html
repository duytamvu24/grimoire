const STEPNAME = {minioninfo:"Minion-Info", demoninfo:"Demon-Info", newimp:"Neuer Imp", travellerinfo:"Traveller-Info"};

function G(){
  if(state.night==null) state.night = 0;
  if(!state.phase) state.phase = "day";
  if(!state.log) state.log = {};
  if(!state.marks) state.marks = {poison:null, safe:null, safeBroken:false, master:null};
  if(!state.bluffs) state.bluffs = [];
  if(state.showArrows==null) state.showArrows = true;
  if(state.logView==null) state.logView = state.night;
  if(state.executedToday===undefined) state.executedToday = null;
  if(state.pendingImp===undefined) state.pendingImp = null;
  if(!state.dayLog) state.dayLog = {};
  if(!state.gone) state.gone = {};
}
const P = id=>state.players.find(p=>p.id===id);
const idx = id=>state.players.findIndex(p=>p.id===id);
const nm = id=>{ const i=idx(id); return i<0 ? ((state.gone||{})[id]||"?") : displayName(state.players[i],i); };
const evil = p=>!!(p && p.role && (p.traveller || (p.role==="goon" && p.align) ? p.align==="evil" : !TYPES[R[p.role].type].good));
const aliveReg = ()=>state.players.filter(p=>!p.dead && !p.traveller).length;
const cur = ()=>state.log[state.night];
const poisoned = p=>!!p && ((state.marks.poison===p.id && p.role!=="beggar") || (!!state.pukka && state.pukka.id===p.id && state.players.some(x=>x.role==="pukka" && !x.dead)));
const inPlay = r=>state.players.some(p=>p.role===r);
function actorsFor(r){ if(r==="lunaticinfo") r="lunatic"; return state.players.filter(p=>p.role===r || (p.role==="drunk" && p.drunkAs===r)); }
function stepName(id){ return STEPNAME[id] || R[id].name; }
function stepIcon(id){ return id==="minioninfo"?"users":id==="demoninfo"?"sparkles":id==="newimp"?"flame":id==="travellerinfo"?"user-plus":id==="lunaticinfo"?R.lunatic.icon:R[id].icon; }
function stepColor(id){ return (id==="minioninfo")?TYPES.mi.color:(id==="demoninfo"||id==="newimp")?TYPES.de.color:id==="travellerinfo"?TYPES.tr.color:id==="lunaticinfo"?TYPES.os.color:TYPES[R[id].type].color; }

function stepList(){
  const n = state.night, c = cur(), L = [];
  if(!c) return L;
  const has = r=>actorsFor(r).length>0;
  const regs = state.players.filter(p=>!p.traveller).length;
  const tInfo = state.players.some(p=>p.traveller && p.align==="evil" && p.needsInfo && !p.dead) || !!c.entries.travellerinfo;
  const alive1 = r=>actorsFor(r).some(p=>!p.dead);
  nightList(n===1).forEach(r=>{
    if(r==="minioninfo"||r==="demoninfo"){ if(regs>=7) L.push(r); return; }
    if(r==="lunaticinfo"){ if(regs>=7 && has("lunatic")) L.push(r); return; }
    if(r==="godfather" && n>1){ if(has(r) && ((c.outDied||[]).length || c.entries[r])) L.push(r); return; }
    if(r==="gossip"){ if(has(r) && (c.gossipTrue || c.entries[r])) L.push(r); return; }
    if(r==="moonchild"){ const m=actorsFor(r)[0]; if(m && m.dead && !c.died.includes(m.id) && (!m.moonDone || c.entries[r])) L.push(r); return; }
    if(["courtier","professor","assassin"].includes(r)){ if(c.entries[r] || actorsFor(r).some(p=>!p.dead && !p.abilityUsed)) L.push(r); return; }
    if(r==="tinker"){ if(alive1(r) || c.entries[r]) L.push(r); return; }
    if(r==="travellerinfo"){ if(tInfo) L.push(r); return; }
    if(r==="newimp"){ if(state.pendingImp || c.entries.newimp) L.push(r); return; }
    if(r==="ravenkeeper"){ if(actorsFor(r).some(p=>c.died.includes(p.id))) L.push(r); return; }
    if(r==="undertaker"){ if(has(r) && c.executed) L.push(r); return; }
    if(has(r) || c.entries[r]) L.push(r);
  });
  return L;
}
function stepActor(id){
  if(id==="minioninfo"||id==="demoninfo"||id==="travellerinfo") return null;
  if(id==="moonchild"){ const m=actorsFor(id)[0]; return m ? m.id : null; }
  if(id==="newimp") return state.pendingImp;
  const as = actorsFor(id);
  if(id==="ravenkeeper"){ const d = as.find(p=>cur().died.includes(p.id)); if(d) return d.id; }
  const a = as.find(p=>!p.dead) || as[0];
  return a ? a.id : null;
}
function E(id){ const c=cur(); if(!c.entries[id]) c.entries[id] = {actor:stepActor(id), picks:[]}; return c.entries[id]; }
function asleep(id,e){ const a=P(e.actor); return !!a && a.dead && !a.zFake && id!=="ravenkeeper" && id!=="newimp" && id!=="moonchild" && !e.applied; }
function fakeWhy(a){ if(!a) return ""; if(poisoned(a)) return "vergiftet"; if(a.role==="drunk") return "Drunk"; if(isBMR()){ const d=drunkReason(a); if(d) return d; } return ""; }

/* --- Rechenhilfen --- */
function pairCount(isEvil){ const L=state.players, n=L.length; let c=0; for(let i=0;i<n;i++){ if(isEvil(L[i]) && isEvil(L[(i+1)%n])) c++; } return c; }
const evilRec = p=>evil(p) || p.role==="recluse";
const evilSpyGood = p=>evil(p) && p.role!=="spy";
function neighbors(id){
  const L=state.players, n=L.length, i=idx(id), out=[];
  for(const dir of [-1,1]){ for(let k=1;k<n;k++){ const q=L[(i+dir*k+n*k)%n]; if(q.id===id) break; if(!q.dead){ out.push(q.id); break; } } }
  return [...new Set(out)];
}
function registers(p,t){ return R[p.role] && (R[p.role].type===t || (p.role==="spy" && (t==="tf"||t==="os")) || (p.role==="recluse" && t==="mi")); }
function ftAnswer(e){
  const ps = e.picks.map(P).filter(Boolean);
  const demon = ps.find(isDemon), rh = ps.find(p=>p.id===state.redHerring);
  if(demon) return {yes:true, why:`${nm(demon.id)} ist der Demon`};
  if(rh) return {yes:true, why:`${nm(rh.id)} ist der Red Herring`};
  return {yes:false, why:"Weder Demon noch Red Herring dabei"};
}

/* --- Imp --- */
function livingMinions(exceptId){ return state.players.filter(p=>!p.dead && p.id!==exceptId && R[p.role] && R[p.role].type==="mi"); }
function impResult(e){
  const a=P(e.actor), t=P(e.picks[0]); if(!a||!t) return null;
  if(poisoned(a)) return {kind:"none", short:"vergiftet", text:"Niemand stirbt: Der Imp ist vergiftet."};
  if(t.dead) return {kind:"none", short:"schon tot", text:`${nm(t.id)} ist schon tot. Es passiert nichts.`};
  if(t.id===a.id){
    const cands = livingMinions(a.id);
    const alive = aliveReg();
    const sw = cands.find(p=>p.role==="scarletwoman" && !poisoned(p));
    let ni = cands.some(c=>c.id===e.newImp) ? e.newImp : (sw && alive>=5 ? sw.id : (cands[0]||{}).id);
    if(sw && alive>=5) ni = sw.id;
    if(!ni) return {kind:"kill", victim:a.id, short:"wählt sich selbst", text:"Der Imp tötet sich selbst, aber kein Minion lebt mehr. Gut gewinnt."};
    return {kind:"star", victim:a.id, newImp:ni, swForced:!!(sw && alive>=5), short:"wählt sich selbst", text:`Der Imp stirbt. ${nm(ni)} wird zum neuen Imp. Wecke ${nm(ni)} und zeig das Imp-Token.`};
  }
  if(state.marks.safe===t.id && !state.marks.safeBroken) return {kind:"none", short:"geschützt", text:`Niemand stirbt: ${nm(t.id)} ist vom Monk geschützt.`};
  if(t.role==="soldier" && !poisoned(t)) return {kind:"none", short:"Soldier", text:`Niemand stirbt: ${nm(t.id)} ist der Soldier.`};
  if(t.role==="mayor" && !poisoned(t)){
    const v = e.redirect && P(e.redirect) && (!P(e.redirect).dead || e.applied && e.applied.victim===e.redirect) ? e.redirect : t.id;
    return {kind:"kill", victim:v, mayor:true, short: v===t.id?"stirbt":"umgeleitet", text: v===t.id ? `${nm(t.id)} (Mayor) stirbt.` : `Umgeleitet: ${nm(v)} stirbt statt des Mayors.`};
  }
  return {kind:"kill", victim:t.id, short:"stirbt", text:`${nm(t.id)} stirbt.`};
}
function revertImp(e){
  const ap = e.applied; if(!ap) return;
  if(ap.swap){ const ni=P(ap.swap.id); if(ni){ ni.role=ap.swap.prev; ni.prevRole=ap.swap.prevPrev; } }
  if(ap.victim){ const v=P(ap.victim); if(v){ v.dead=false; v.ghostUsed=false; } const d=cur().died, k=d.indexOf(ap.victim); if(k>=0) d.splice(k,1); }
  e.applied = null;
}
function applyImp(e){
  revertImp(e);
  const r = impResult(e); e.res = r; if(!r) return;
  const ap = {};
  if(r.kind==="kill"||r.kind==="star"){ const v=P(r.victim); if(v && !v.dead){ v.dead=true; v.ghostUsed=false; cur().died.push(v.id); ap.victim=v.id; } }
  if(r.kind==="star" && r.newImp){ const ni=P(r.newImp); ap.swap={id:ni.id, prev:ni.role, prevPrev:ni.prevRole}; ni.prevRole=ni.role; ni.role="imp"; }
  e.applied = (ap.victim||ap.swap) ? ap : null;
  if(ap.victim) checkEvilWin();
}

/* --- Tod, Hinrichtung, Scarlet Woman --- */
function toast(text){ ui.toast=text; clearTimeout(toastT); toastT=setTimeout(()=>{ ui.toast=null; const t=document.querySelector(".toast"); if(t) t.remove(); }, 7000); }
function kill(p, executed){
  const aliveBefore = aliveReg();
  p.dead = true; p.ghostUsed = false; p.zFake = false;
  if(p.role==="beggar") p.tokens = 0;
  if(state.phase==="night" && cur()) cur().died.push(p.id);
  else if(state.phase==="day") (state.diedToday=state.diedToday||[]).push(p.id);
  if(executed){
    state.executedToday = p.id;
    if(p.role==="saint") toast(poisoned(p) ? "Der Saint war vergiftet: Das Spiel geht weiter." : "Der Saint wurde hingerichtet: Böse gewinnt.");
    if(isBMR() && R[p.role] && R[p.role].type==="mi") minstrelTrigger(p);
  }
  if(isBMR() && p.role==="moonchild") toast(`${nm(p.id)} war der Moonchild: Er wählt öffentlich einen lebenden Spieler. Ist der gut, stirbt er heute Nacht.`);
  if(isDemon(p)) demonDied(aliveBefore, executed);
  checkEvilWin();
}
function checkEvilWin(){
  const alive=state.players.filter(p=>aliveOrFake(p) && !p.traveller);
  if(alive.length<=2 && alive.some(isDemon)) toast("Nur noch 2 leben und der Demon lebt: Böse gewinnt.");
}
function revive(p){
  p.dead = false; p.ghostUsed = false; p.zFake = false;
  if(state.executedToday===p.id) state.executedToday = null;
  if(state.diedToday){ const k=state.diedToday.indexOf(p.id); if(k>=0) state.diedToday.splice(k,1); }
  const c=cur(); if(c && state.phase==="night"){ const k=c.died.indexOf(p.id); if(k>=0) c.died.splice(k,1); }
}
function demonDied(aliveBefore, executed){
  if(isBMR()){
    if(state.players.some(x=>isDemon(x) && aliveOrFake(x))) return;
    const mm = state.players.find(x=>x.role==="mastermind" && !x.dead);
    if(executed && mm && !impaired(mm) && !state.mm){ state.mm = {day: state.night+1, by: mm.id}; toast(`Der Demon wurde hingerichtet, aber der Mastermind (${nm(mm.id)}) lebt: Sag den Sieg nicht an. Es folgt noch eine Nacht und ein Tag. Wird dann jemand hingerichtet, verliert sein Team.`); }
    else toast("Der Demon ist tot: Gut gewinnt.");
    return;
  }
  if(state.players.some(x=>x.role==="imp" && !x.dead)) return;
  const sw = state.players.find(x=>x.role==="scarletwoman" && !x.dead);
  if(sw && aliveBefore>=5 && !poisoned(sw)){ sw.prevRole="scarletwoman"; sw.role="imp"; state.pendingImp=sw.id; toast(`${nm(sw.id)} übernimmt als Imp (war Scarlet Woman).`); }
  else if(sw && poisoned(sw)) toast("Der Imp ist tot und die Scarlet Woman vergiftet: Gut gewinnt.");
  else if(sw) toast("Der Imp ist tot, weniger als 5 lebten: Gut gewinnt.");
  else toast("Der Imp ist tot: Gut gewinnt.");
}
function toggle(id,t){
  const p=P(id); if(!p) return;
  if(t==="ability"){
    if(p.abilityUsed){ toast(`${R[abilityOf(p)].name}: Die Fähigkeit wurde schon genutzt.`); render(); return; }
    if(p.dead){ toast("Tote Spieler haben keine Fähigkeit mehr."); render(); return; }
    ui.ability = {id:p.id, picks:[], choice:false, applied:false}; render(); return;
  }
  if(t==="ghost"){ if(p.dead){ p.ghostUsed=!p.ghostUsed; save(); if(ui.page) render(); else drawBoard(); } return; }
  if(p.dead){ revive(p); save(); render(); return; }
  if(state.phase==="day" && state.night>=1){ ui.deathAsk=id; render(); return; }
  kill(p,false); save(); render();
}

/* ===== Bad Moon Rising: Regeln und Nachtschritte ===== */
Object.assign(HINTS, BMR_HINTS);
Object.assign(STEPNAME, {lunaticinfo:"Lunatic-Info"});
const isBMR = ()=>ED()==="bmr";
const isDemon = p=>!!(p && R[p.role] && R[p.role].type==="de");
const aliveOrFake = p=>!p.dead || p.zFake;
const edOf = r=>r.ed || "tb";
function EROLES(t){ return ROLES.filter(r=>edOf(r)===ED() && (!t || r.type===t)); }
const TRAVL = ()=>TRAV_BY[ED()] || [];
function nightList(first){ return NIGHTS[ED()] ? NIGHTS[ED()][first?"first":"other"] : (first?FIRST:OTHER); }

/* --- Betrunken-System --- */
function drunkReason(p, depth){
  if(!p || !isBMR()) return "";
  depth = depth||0;
  const m = state.marks||{};
  if((m.drunk||[]).includes(p.id)) return "Betrunken";
  const C = state.courtier;
  if(C && C.effective && C.target===p.id && state.night>=C.night && state.night<=C.night+2 && depth<2){
    const cp = P(C.by);
    if(cp && !cp.dead && !impaired(cp, depth+1)) return `Betrunken (Courtier ${state.night-C.night+1}/3)`;
  }
  const M = state.minstrel;
  if(M && !p.traveller && p.role!=="minstrel" && (state.night===M.night+1 || (state.night===M.night && state.phase==="day"))) return "Betrunken (Minstrel)";
  return "";
}
function impaired(p, depth){ return !!p && (poisoned(p) || p.role==="drunk" || !!drunkReason(p, depth)); }
function courtierPaused(p){
  const C=state.courtier; if(!C || !C.effective || C.target!==p.id || state.night<C.night || state.night>C.night+2) return false;
  const cp=P(C.by); return !cp || cp.dead || impaired(cp,1);
}
function pushDrunk(id){ if(!id) return; const m=state.marks; m.drunk=m.drunk||[]; if(!m.drunk.includes(id)) m.drunk.push(id); }

/* --- Schutz --- */
function teaProtected(t){
  return state.players.some(tl=>tl.role==="tealady" && !tl.dead && !impaired(tl) && (()=>{
    const ns = neighbors(tl.id).map(P).filter(Boolean);
    return ns.length===2 && ns.every(x=>!evil(x)) && ns.some(x=>x.id===t.id);
  })());
}
function protectedFrom(t, src){
  if(src==="assassin" || src==="manual") return "";
  if(state.phase==="night" && src!=="exec" && (state.marks.safeInn||[]).includes(t.id) && !state.marks.innBroken) return "Innkeeper";
  if(t.role==="sailor" && !impaired(t)) return "Sailor, nüchtern";
  if(teaProtected(t)) return "Tea Lady";
  if(src==="exec" && state.marks.da===t.id && !state.marks.daBroken) return "Devil's Advocate";
  if(t.role==="fool" && !impaired(t) && !t.abilityUsed) return "Fool";
  return "";
}
function applyDeath(t, o){
  o = o||{};
  if(!t) return {died:false, text:""};
  if(t.dead && !t.zFake) return {died:false, text:`${nm(t.id)} ist schon tot.`};
  if(t.zFake){ t.zFake=false; kill2(t, o.exec, true); return {died:true, text:`${nm(t.id)} stirbt endgültig (Zombuul).`}; }
  const prot = protectedFrom(t, o.src);
  if(prot){ if(prot==="Fool") t.abilityUsed=true; return {died:false, prot, text:`${nm(t.id)} überlebt (${prot}).`}; }
  if(t.role==="zombuul" && !impaired(t) && !t.zUsed){
    t.dead=true; t.zFake=true; t.zUsed=true; t.ghostUsed=false;
    if(state.phase==="night" && cur()) cur().died.push(t.id); else (state.diedToday=state.diedToday||[]).push(t.id);
    if(o.exec) state.executedToday=t.id;
    return {died:true, fake:true, text:`${nm(t.id)} stirbt scheinbar: Tod ansagen, der Zombuul lebt aber weiter.`};
  }
  kill2(t, o.exec, false);
  return {died:true, text:`${nm(t.id)} stirbt.`};
}
function kill2(t, exec, already){
  if(already){
    if(state.phase==="night" && cur() && !cur().died.includes(t.id)) cur().died.push(t.id);
    if(exec) state.executedToday=t.id;
    demonDied(aliveRegCount(), exec); checkEvilWin(); return;
  }
  kill(t, !!exec);
}
const aliveRegCount = ()=>state.players.filter(p=>aliveOrFake(p) && !p.traveller).length;
function grandmotherChain(v, lines){
  if(state.grandchild!==v.id) return;
  const gm = state.players.find(p=>p.role==="grandmother" && !p.dead);
  if(!gm) return;
  if(impaired(gm)){ lines.push(`Die Grandmother überlebt (${fakeWhy(gm)}).`); return; }
  const r = applyDeath(gm, {src:"other"});
  lines.push(r.died ? `Die Grandmother stirbt mit (Enkelkind getötet).` : `Die Grandmother überlebt (${r.prot}).`);
}

function unDie(id){ const c=cur(); if(c){ const k=c.died.indexOf(id); if(k>=0) c.died.splice(k,1); } }
function lunAs(){ const l=state.players.find(p=>p.role==="lunatic"); if(l && l.lunAs) return l.lunAs; const d=state.players.find(isDemon); return d ? d.role : "pukka"; }
/* --- Schnappschüsse für saubere Neuberechnung einzelner Schritte --- */
function takeSnap(){ const c=cur(); return JSON.stringify({players:state.players, marks:state.marks, pukka:state.pukka||null, courtier:state.courtier||null, minstrel:state.minstrel||null, poCharged:!!state.poCharged, grandchild:state.grandchild||null, executedToday:state.executedToday, mm:state.mm||null, died:c.died, goonBy:c.goonBy||null, exorcised:!!c.exorcised, diedToday:state.diedToday||[]}); }
function restoreSnap(s){ const o=JSON.parse(s), c=cur(); state.players=o.players; state.marks=o.marks; state.pukka=o.pukka; state.courtier=o.courtier; state.minstrel=o.minstrel; state.poCharged=o.poCharged; state.grandchild=o.grandchild; state.executedToday=o.executedToday; state.mm=o.mm; c.died=o.died; c.goonBy=o.goonBy; c.exorcised=o.exorcised; state.diedToday=o.diedToday; }
function applyStep(id, fresh){
  const e=E(id);
  if(!fresh && e.snap) restoreSnap(e.snap);
  e.snap = takeSnap();
  computeStep(id, e);
}
function applyChain(id){
  const L=stepList(), i=L.indexOf(id), c=cur(), e=E(id);
  if(!e.snap){ const later=L.slice(i+1).find(s=>c.entries[s] && c.entries[s].snap); if(later) restoreSnap(c.entries[later].snap); }
  applyStep(id, false);
  L.slice(i+1).forEach(s=>{ const e=cur().entries[s]; if(e && e.snap) applyStep(s, true); });
}
function prevPick(id){ const c=state.log[state.night-1]; const e=c && c.entries[id]; return e && e.picks ? e.picks[0] : null; }
function goonCheck(id, e, lines){
  if(!GOONSTEPS.has(id) || !e.actor) return;
  const c=cur(), g=state.players.find(p=>p.role==="goon" && !p.dead);
  if(!g || g.id===e.actor || !e.picks.includes(g.id)) return;
  if(c.goonBy && c.goonBy!==id) return;
  if(impaired(g)) return;
  const a=P(e.actor); c.goonBy=id; pushDrunk(a.id);
  g.align = evil(a) ? "evil" : "good";
  lines.push(`Goon gewählt: ${nm(a.id)} ist jetzt betrunken. Der Goon ist ab jetzt ${g.align==="evil"?"böse":"gut"}: Wecke ihn kurz und zeig ihm sein Team.`);
}

/* --- Berechnung pro Schritt --- */
function computeStep(id, e){
  const c=cur(), n=state.night, lines=[];
  e.lines=lines; e.res=""; e.logText=""; e.arrows=[];
  goonCheck(id, e, lines);
  const a=P(e.actor), fk = a ? fakeWhy(a) : "";
  const t=P(e.picks[0]);
  const kill = (v, src)=>{ const r=applyDeath(v,{src}); if(r.died && src==="demon" && !r.fake) grandmotherChain(v, lines); return r; };
  switch(id){
    case "sailor": {
      if(!t) break;
      if(t.id===a.id) e.drunkWho="self";
      else if(!e.drunkSet) e.drunkWho = R[t.role].type==="tf" ? "target" : "self";
      const did = e.drunkWho==="self" ? a.id : t.id;
      if(!fk) pushDrunk(did);
      e.res = fk ? "Die Wahl hat keine Wirkung." : `${nm(did)} ist bis morgen Abend betrunken.`;
      e.logText = `Sailor (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>: ${fk?"keine Wirkung":`betrunken ist ${esc(nm(did))}`}`;
      e.arrows=[{to:t.id, label:fk?"keine Wirkung":`Drunk: ${nm(did)}`}];
      break; }
    case "innkeeper": {
      const ps=e.picks.map(P).filter(Boolean); if(!ps.length) break;
      state.marks.safeInn = ps.map(p=>p.id); state.marks.innBroken = !!fk;
      if(ps.length===2){
        if(!e.drunkSet || !ps.some(p=>p.id===e.drunkId)) e.drunkId = (ps.find(p=>!evil(p)) || ps[0]).id;
        if(!fk) pushDrunk(e.drunkId);
        if(e.drunkId===a.id && !fk){ state.marks.innBroken=true; }
      }
      e.res = state.marks.innBroken ? "Der Schutz wirkt nicht." : (ps.length===2 ? `Beide sind heute Nacht geschützt. ${nm(e.drunkId)} ist betrunken.` : "");
      e.logText = `Innkeeper (${esc(nm(a.id))}) schützt ${ps.map(p=>`<b>${esc(nm(p.id))}</b>`).join(" und ")}${state.marks.innBroken?" · wirkt nicht":""}${e.drunkId?`, betrunken: ${esc(nm(e.drunkId))}`:""}`;
      e.arrows = ps.map(p=>({to:p.id, label: p.id===e.drunkId ? "Schutz + Drunk" : "Schutz"}));
      break; }
    case "courtier": {
      if(e.none || !e.role){ e.logText = `Courtier (${esc(nm(a.id))}) verzichtet`; break; }
      a.abilityUsed = true;
      const tp = state.players.find(p=>p.role===e.role);
      state.courtier = {by:a.id, role:e.role, target: tp?tp.id:null, night:n, effective:!fk};
      e.res = fk ? "Keine Wirkung, die Fähigkeit ist trotzdem verbraucht." : tp ? `${nm(tp.id)} (${R[e.role].name}) ist 3 Nächte und 3 Tage betrunken.` : `${R[e.role].name} ist nicht im Spiel. Es passiert nichts, der Courtier erfährt das nicht.`;
      e.logText = `Courtier (${esc(nm(a.id))}) wählt <b>${esc(R[e.role].name)}</b>: ${esc(e.res)}`;
      if(tp && !fk) e.arrows=[{to:tp.id, label:"Drunk 3 Nächte"}];
      break; }
    case "devilsadvocate": {
      if(!t) break;
      state.marks.da = t.id; state.marks.daBroken = !!fk;
      e.res = fk ? "Der Schutz wirkt nicht." : `${nm(t.id)} überlebt morgen eine Hinrichtung.`;
      e.logText = `Devil's Advocate (${esc(nm(a.id))}) schützt <b>${esc(nm(t.id))}</b> vor der Hinrichtung${fk?" · wirkt nicht":""}`;
      e.arrows=[{to:t.id, label:"überlebt Hinrichtung"}];
      break; }
    case "exorcist": {
      if(!t) break;
      c.exorcised = !!(!fk && isDemon(t) && aliveOrFake(t));
      e.res = c.exorcised ? `${nm(t.id)} ist der Demon: Wecke ihn, zeig ihm den Exorcist (${nm(a.id)}). Danach schläft er und tötet heute Nacht nicht.` : fk ? "Keine Wirkung." : "Kein Demon. Es passiert nichts.";
      e.logText = `Exorcist (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>${c.exorcised?": Demon gesperrt":""}`;
      e.arrows=[{to:t.id, label:c.exorcised?"Demon gesperrt":"Exorcist"}];
      break; }
    case "gambler": {
      if(!t || !e.guess) break;
      const right = t.role===e.guess;
      let txt = right ? "Richtig. Es passiert nichts." : "Falsch.";
      if(!right){
        if(fk) txt += ` Der Gambler überlebt (${fk}).`;
        else { const r=kill(a,"tf"); txt += r.died ? " Der Gambler stirbt." : ` ${r.text}`; }
      }
      e.res = txt;
      e.logText = `Gambler (${esc(nm(a.id))}) rät <b>${esc(nm(t.id))}</b> = ${esc(R[e.guess].name)}: ${esc(txt)}`;
      e.arrows=[{to:t.id, label:`${R[e.guess].name}: ${right?"richtig":"falsch"}`}];
      break; }
    case "godfather": {
      if(n===1){ e.logText = `Godfather (${esc(nm(a.id))}) sieht: <b>${(e.shown||[]).map(r=>esc(R[r].name)).join(", ")||"keine Outsider"}</b>`; break; }
      if(!t) break;
      if(fk){ e.res=`Keine Wirkung (${fk}).`; }
      else { const r=kill(t,"minion"); e.res=r.text; }
      e.logText = `Godfather (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>: ${esc(e.res)}`;
      e.arrows=[{to:t.id, label:e.res.includes("stirbt")?"stirbt":"überlebt"}];
      break; }
    case "pukka": {
      const old = state.pukka;
      if(n>1 && old && old.id){
        const ov=P(old.id);
        if(fk){ e.oldRes = `${nm(old.id)} stirbt heute nicht: Der Pukka ist ${fk}. Er bleibt vergiftet.`; }
        else {
          state.pukka = null;
          const r = ov ? kill(ov,"demon") : {text:""};
          e.oldRes = r.died ? `${nm(old.id)} war vergiftet und stirbt jetzt.` : `${r.text} Er ist wieder gesund.`;
        }
      } else e.oldRes = "";
      if(c.exorcised){ e.res="Der Pukka schläft (Exorcist): Niemand Neues wird vergiftet."; }
      else if(t){
        if(fk) e.res = `Keine Wirkung (${fk}): ${nm(t.id)} ist nicht vergiftet.`;
        else { state.pukka = {id:t.id, night:n}; e.res = `${nm(t.id)} ist vergiftet und stirbt in der nächsten Nacht.`; }
      }
      e.logText = `Pukka (${esc(nm(a.id))})${t&&!c.exorcised?` vergiftet <b>${esc(nm(t.id))}</b>`:""}${e.oldRes?` · ${esc(e.oldRes)}`:""}${c.exorcised?" · vom Exorcist gesperrt":""}`;
      if(t && !c.exorcised) e.arrows=[{to:t.id, label:"Gift"}];
      break; }
    case "zombuul": {
      const dd = c.dayDeaths||[];
      if(dd.length){ e.res = `Der Zombuul schläft: Heute ist ${dd.map(nm).join(", ")} gestorben.`; e.logText = esc(e.res); break; }
      if(c.exorcised){ e.res="Der Zombuul schläft (Exorcist)."; e.logText=e.res; break; }
      if(!t) break;
      if(fk){ e.res=`Niemand stirbt (${fk}).`; }
      else { const r=kill(t,"demon"); e.res=r.text; }
      e.logText = `Zombuul (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>: ${esc(e.res)}`;
      e.arrows=[{to:t.id, label:e.res.includes("stirbt")?"stirbt":"überlebt"}];
      break; }
    case "shabaloth": {
      const out=[];
      if(e.revive){
        const rv=P(e.revive);
        if(rv && rv.dead && !fk){ rv.dead=false; rv.ghostUsed=false; rv.abilityUsed=false; rv.zFake=false; unDie(rv.id); out.push(`${nm(rv.id)} kommt zurück (am Morgen nur ansagen, dass er lebt).`); }
      }
      if(c.exorcised){ out.push("Der Shabaloth schläft (Exorcist), niemand stirbt."); }
      else if(e.picks.length){
        e.picks.map(P).filter(Boolean).forEach(v=>{ if(fk) out.push(`${nm(v.id)}: keine Wirkung (${fk}).`); else out.push(kill(v,"demon").text); });
      }
      e.res = out.join(" ");
      e.logText = `Shabaloth (${esc(nm(a.id))}) wählt ${e.picks.map(x=>`<b>${esc(nm(x))}</b>`).join(" und ")||"–"}: ${esc(e.res)}`;
      e.arrows = e.picks.map(x=>({to:x, label:"Shabaloth"}));
      break; }
    case "po": {
      if(e.charged==null) e.charged = !!state.poCharged;
      if(c.exorcised){ e.res = "Der Po schläft (Exorcist). Seine Ladung bleibt, wie sie ist."; e.logText=esc(e.res); break; }
      if(e.none && !e.charged){ state.poCharged = true; e.res = "Niemand gewählt: Nächste Nacht wählt der Po drei Spieler."; e.logText = `Po (${esc(nm(a.id))}) wählt niemanden und lädt auf`; break; }
      const out=[];
      e.picks.map(P).filter(Boolean).forEach(v=>{ if(fk) out.push(`${nm(v.id)}: keine Wirkung (${fk}).`); else out.push(kill(v,"demon").text); });
      if(e.picks.length) state.poCharged = false;
      e.res = out.join(" ");
      e.logText = `Po (${esc(nm(a.id))})${e.charged?" (aufgeladen)":""} wählt ${e.picks.map(x=>`<b>${esc(nm(x))}</b>`).join(", ")||"–"}: ${esc(e.res)}`;
      e.arrows = e.picks.map(x=>({to:x, label:"Po"}));
      break; }
    case "assassin": {
      if(e.none){ e.logText = `Assassin (${esc(nm(a.id))}) verzichtet`; break; }
      if(!t) break;
      a.abilityUsed = true;
      if(fk) e.res = `Keine Wirkung (${fk}). Die Fähigkeit ist verbraucht.`;
      else { const r=applyDeath(t,{src:"assassin"}); e.res = r.text; }
      e.logText = `Assassin (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>: ${esc(e.res)}`;
      e.arrows=[{to:t.id, label:"Assassin"}];
      break; }
    case "gossip": {
      if(!t) break;
      const g=P(e.actor);
      if(!g || g.dead || fk){ e.res = `Niemand stirbt: Die Gossip ist ${g&&g.dead?"tot":fk}.`; }
      else { const r=kill(t,"tf"); e.res=r.text; }
      e.logText = `Gossip-Aussage war wahr: <b>${esc(nm(t.id))}</b> · ${esc(e.res)}`;
      break; }
    case "professor": {
      if(e.none){ e.logText = `Professor (${esc(nm(a.id))}) verzichtet`; break; }
      if(!t) break;
      a.abilityUsed = true;
      if(fk) e.res = `Keine Wirkung (${fk}). Die Fähigkeit ist verbraucht.`;
      else if(t.dead && R[t.role].type==="tf"){ t.dead=false; t.ghostUsed=false; t.abilityUsed=false; unDie(t.id); e.res = `${nm(t.id)} wird wiederbelebt. Am Morgen nur ansagen, dass er lebt.`; }
      else e.res = `${nm(t.id)} ist kein toter Townsfolk. Es passiert nichts, die Fähigkeit ist verbraucht.`;
      e.logText = `Professor (${esc(nm(a.id))}) wählt <b>${esc(nm(t.id))}</b>: ${esc(e.res)}`;
      e.arrows=[{to:t.id, label:"Professor"}];
      break; }
    case "tinker": {
      if(!e.die){ e.logText = "Tinker: überlebt die Nacht"; break; }
      const tk=P(e.actor); const r=kill(tk,"os"); e.res=r.text;
      e.logText = `Tinker stirbt durch seine Fähigkeit: ${esc(r.text)}`;
      break; }
    case "moonchild": {

    case "assassin": case "professor": {

function wokeTonight(pid){
  const c=cur();
  for(const [sid,e] of Object.entries(c.entries)){
    if(e.actor!==pid || e.skipped) continue;
    if(["minioninfo","demoninfo","travellerinfo","chambermaid","gossip","moonchild","tinker"].includes(sid)) continue;
    if(sid==="lunaticinfo"||sid==="lunatic") return {woke:true, unsure:true, why:"Lunatic: Du entscheidest"};
    if(BMR_DEMONS.includes(sid) && c.exorcised) return {woke:false, why:"nur vom Exorcist geweckt, zählt nicht"};
    if(sid==="zombuul" && (c.dayDeaths||[]).length) return {woke:false, why:"Zombuul schlief"};
    return {woke:true, why:`${R[sid]?R[sid].name:sid}: aufgewacht${e.none?", hat verzichtet":""}`};
  }
  return {woke:false, why:"nicht geweckt"};
}
function bmrShow(id, e){
  if(id==="lunaticinfo") return (e.bluffs||[]).length ? {kind:"bluffs", roles:e.bluffs} : null;
  if(id==="grandmother") return e.picks[0] && e.role ? {kind:"role", role:e.role} : null;
  if(id==="chambermaid") return e.picks.length===2 ? {kind:"num", value:e.value||0} : null;
  if(id==="godfather" && state.night===1) return (e.shown||[]).length ? {kind:"bluffs", roles:e.shown} : null;
  if(id==="exorcist") return cur().exorcised ? {kind:"role", role:"exorcist"} : null;
  return null;
}
function bmrPickSpec(id, e){

    lunaticinfo:{max: state.players.filter(p=>!p.traveller && R[p.role] && R[p.role].type==="mi").length},
    sailor:{max:1, alive:true}, innkeeper:{max:2}, devilsadvocate:{max:1, alive:true, notLast:true}, exorcist:{max:1, notLast:true},
    gambler:{max:1}, pukka:{max:1}, zombuul:{max:1}, shabaloth:{max:2}, po:{max: e.charged?3:1}, assassin:{max:1},
    godfather:{max:1}, gossip:{max:1}, professor:{max:1, deadOnly:true}, moonchild:{max:1, alive:true},
    grandmother:{max:1, goodOnly:true, self:false}, chambermaid:{max:2, self:false, alive:true}, lunatic:{max:3}

  if(BMR_DEMONS.includes(id) && c.exorcised) return null;
  if(id==="zombuul" && (c.dayDeaths||[]).length) return null;
  if((id==="po"||id==="assassin"||id==="professor") && e.none) return null;
  if(id==="lunatic"){ const b=lunAs(); S.max = b==="shabaloth"?2 : b==="po"?3 : 1; }
  return S;
}
function bmrTapCheck(s, id, e){
  const p=P(id); if(!p) return "";
  if(s.alive && p.dead) return p.zFake ? "Der Zombuul gilt als tot und kann hier nicht gewählt werden." : "Nur lebende Spieler.";
  if(s.deadOnly && !p.dead) return "Nur tote Spieler.";
  if(s.goodOnly && evil(p)) return "Nur gute Spieler.";

function bmrAct(a, v){
  const id=state.curStep, e=E(id);
  if(a==="bset"){ const [k,val]=v.split("=");
    if(k==="none") e.none=!e.none; else e[k] = val==="" ? (k==="revive"?null:false) : (val==="1"?true:val);
    if(k==="drunkWho"||k==="drunkId") e.drunkSet=true; if(k==="none" && e.none) e.picks=[];
    if(BMR_STATEFUL.has(id)) applyChain(id); return; }
  if(a==="bset-role"){ e.role = e.role===v ? null : v; e.none=false; applyChain(id); return; }
  if(a==="bset-guess"){ e.guess = v; applyChain(id); return; }
  if(a==="lbluff"){ e.bluffs=e.bluffs||[]; const k=e.bluffs.indexOf(v); if(k>=0) e.bluffs.splice(k,1); else if(e.bluffs.length<3) e.bluffs.push(v); return; }
  if(a==="gfshow"){ const k=e.shown.indexOf(v); if(k>=0) e.shown.splice(k,1); else e.shown.push(v); return; }
}

/* --- Hinrichtung in Bad Moon Rising --- */
function pacifistActive(){ return state.players.some(p=>p.role==="pacifist" && !p.dead && !impaired(p)); }
function execOutcome(p, pacSave){
  if(!p) return {died:false};
  if(p.dead && !p.zFake) return {died:false, already:true};
  const prot = protectedFrom(p, "exec");
  if(prot) return {died:false, prot};
  if(pacSave && !evil(p) && pacifistActive()) return {died:false, prot:"Pacifist"};
  return {died:true};
}
function bmrExecute(p, pacSave){
  const o = execOutcome(p, pacSave);
  const mmDay = state.mm && state.night===state.mm.day;
  if(!o.died){
    state.executedToday = p.id;
    if(o.prot==="Fool") p.abilityUsed = true;
    if(!o.already) toast(`${nm(p.id)} wird hingerichtet, bleibt aber am Leben (${o.prot}). Sag nur die Hinrichtung an, ohne Grund.`);
  } else {
    const r = applyDeath(p, {exec:true, src:"exec"});
    if(r.fake) toast(r.text);
  }
  if(mmDay) toast(evil(p) ? "Mastermind-Tag: Ein Böser wurde hingerichtet. Gut gewinnt." : "Mastermind-Tag: Ein Guter wurde hingerichtet. Böse gewinnt.");
  return o;
}
function minstrelTrigger(p){
  const m = state.players.find(x=>x.role==="minstrel" && !x.dead);
  if(!m || impaired(m)) return;
  state.minstrel = {night: state.night, by: m.id};
  toast(`Ein Minion wurde hingerichtet: Wegen des Minstrels sind alle anderen bis morgen Abend betrunken.`);
}
function bmrBadges(p){
  const out=[], m=state.marks||{};
  const dr=drunkReason(p); if(dr) out.push(["poison", dr]);
  if(courtierPaused(p)) out.push(["", "Courtier pausiert"]);
  if(state.pukka && state.pukka.id===p.id && state.players.some(x=>x.role==="pukka" && !x.dead)) out.push(["poison","Gift (Pukka)"]);
  if(state.phase==="night" && (m.safeInn||[]).includes(p.id)) out.push(["safe", "Geschützt (Innkeeper)"+(m.innBroken?" · wirkt nicht":"")]);
  if(m.da===p.id) out.push(["safe", "überlebt Hinrichtung"+(m.daBroken?" · wirkt nicht":"")]);
  if(!p.dead && teaProtected(p)) out.push(["safe","Tea-Lady-Schutz"]);
  if(state.grandchild===p.id) out.push(["", "Enkelkind"]);

function bmrFacts(p){
  const f=[];
  const dr=drunkReason(p); if(dr) f.push(`<div><b>${esc(dr)}</b> seine Fähigkeit wirkt nicht</div>`);
  if(courtierPaused(p)) f.push(`<div><b>Courtier pausiert</b> gerade nüchtern, weil der Courtier betrunken, vergiftet oder tot ist</div>`);
  if(state.pukka && state.pukka.id===p.id) f.push(`<div><b>Vergiftet (Pukka)</b> stirbt in der nächsten Nacht</div>`);
  if(state.grandchild===p.id) f.push(`<div><b>Enkelkind</b> der Grandmother</div>`);
  if(p.zFake) f.push(`<div><b>Zombuul</b> gilt als tot, lebt aber weiter</div>`);
  if(p.role==="lunatic") f.push(`<div><b>Glaubt, er ist</b> ${esc(R[lunAs()].name)}</div>`);
  if(p.role==="goon" && p.align) f.push(`<div><b>Goon-Team</b> ${p.align==="evil"?"böse":"gut"}</div>`);
  if(p.role==="sailor") f.push(`<div><b>Sailor</b> ${impaired(p)?"betrunken oder vergiftet: kann sterben":"nüchtern: kann nicht sterben"}</div>`);

/* ===== QR-Modus: Handys der Spieler verbinden (nur wenn gewählt) ===== */
const QR_LIBS = {peer:"https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js", qr:"https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"};
const ONE_SHOT = ["slayer","virgin","courtier","professor","assassin"];
const net = {peer:null, conns:{}, status:"off", err:"", sent:{}, scriptSent:{}, retry:null, names:{}};
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("load")); document.head.appendChild(s); }); }
async function qrLibs(){ if(!window.Peer) await loadScript(QR_LIBS.peer); if(!window.qrcode) await loadScript(QR_LIBS.qr); }
function peerOpts(){ return Object.assign({debug:0}, window.GRIM_PEER||{}); }
function qrWhere(){ let framed=false; try{ framed = window.top!==window; }catch(e){ framed=true; } if(framed || /claude|anthropic/.test(location.hostname)) return "claude"; return /^https?:$/.test(location.protocol) ? "web" : "file"; }
function qrOn(){ return !!(state.qr && state.qr.room); }
function qrEnable(){ if(!qrOn()) state.qr = {room:"grim-"+uid()+uid().slice(0,4), waiting:[]}; qrStart(); }
function qrDisable(){ qrStop(); state.players.forEach(p=>{ delete p.pid; }); state.qr = null; }
function playerUrl(){
  if(settings.playerUrl) return settings.playerUrl.trim();
  if(/^https?:$/.test(location.protocol)) return new URL("spieler.html", location.href).href.split("#")[0];
  return "";
}
function joinLink(){ const u=playerUrl(); return u && qrOn() ? `${u}#r=${encodeURIComponent(state.qr.room)}` : ""; }
async function qrStart(){
  if(!qrOn() || (net.peer && !net.peer.destroyed)) return;
  clearTimeout(net.retry); net.status="connecting"; qrRefresh();
  try{ await qrLibs(); }catch(e){ net.status="error"; net.err="Keine Internetverbindung: Die QR-Funktion konnte nicht geladen werden. Ohne Handys geht alles wie gewohnt."; net.retry=setTimeout(qrStart, 8000); qrRefresh(); return; }
  if(!qrOn()) return;
  let peer;
  try{ peer = new Peer(state.qr.room, peerOpts()); }catch(e){ net.status="error"; net.err="Verbindung nicht möglich."; qrRefresh(); return; }
  net.peer = peer;
  peer.on("open", ()=>{ net.status="online"; net.err=""; qrRefresh(); });
  peer.on("connection", c=>qrConn(c));
  peer.on("disconnected", ()=>{ if(peer.destroyed) return; net.status="connecting"; qrRefresh(); setTimeout(()=>{ try{ if(!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){} }, 2500); });
  peer.on("error", err=>{
    const t = err && err.type;
    if(t==="peer-unavailable") return;
    if(t==="unavailable-id"){ net.err="Der Raum ist noch belegt, z. B. in einem anderen Tab. Neuer Versuch …"; }
    else net.err = qrWhere()==="claude" ? "In der claude.ai-Ansicht blockiert der Browser die Verbindung. Öffne das Grimoire für den QR-Modus über deine GitHub-Seite oder als Datei." : `Keine Verbindung zum Vermittlungsdienst (${t||"unbekannt"}). Prüfe das Internet. Neuer Versuch …`;
    net.status="error"; try{ peer.destroy(); }catch(e){} if(net.peer===peer) net.peer=null;
    clearTimeout(net.retry); net.retry=setTimeout(qrStart, 5000); qrRefresh();
  });
}
function qrStop(){ clearTimeout(net.retry); Object.values(net.conns).forEach(c=>{ try{ c.close(); }catch(e){} }); net.conns={}; net.sent={}; if(net.peer){ try{ net.peer.destroy(); }catch(e){} } net.peer=null; net.status="off"; net.err=""; }
function qrConn(c){
  c.on("open", ()=>{ const m=c.metadata||{}; if(m.pid) qrHello(c, m.pid, m.name); else c.close(); });
  c.on("data", d=>{ if(!d || typeof d!=="object") return; if(d.t==="name" && c._pid) qrRename(c._pid, d.name); });
  c.on("close", ()=>{ if(c._pid && net.conns[c._pid]===c){ delete net.conns[c._pid]; delete net.sent[c._pid]; qrChanged(); } });
  c.on("error", ()=>{});
}
const cleanName = n=>String(n||"").replace(/\s+/g," ").trim().slice(0,24);
function qrHello(c, pid, name){
  pid = String(pid).slice(0,48); name = cleanName(name);
  const old = net.conns[pid]; if(old && old!==c){ try{ old.close(); }catch(e){} }
  net.conns[pid] = c; c._pid = pid; delete net.sent[pid]; delete net.scriptSent[pid]; net.names[pid] = name;
  const p = state.players.find(x=>x.pid===pid);
  if(p){ if(name && (!p.name.trim() || p.phoneName)) { p.name = name; p.phoneName = true; } }
  else qrSeat(pid, name);
  save(); qrChanged(true);
}
function qrRename(pid, name){
  name = cleanName(name); if(!name) return; net.names[pid] = name;
  const p = state.players.find(x=>x.pid===pid); if(p){ p.name = name; p.phoneName = true; }
  const w = (state.qr.waiting||[]).find(x=>x.pid===pid); if(w) w.name = name;

}
/* Neues Handy: in der Einrichtung bekommt es einen Platz, im laufenden Spiel wartet es auf deine Zuordnung */
function qrSeat(pid, name){
  if(state.players.some(x=>x.pid===pid)) return;
  state.qr.waiting = (state.qr.waiting||[]).filter(w=>w.pid!==pid);
  if(state.step==="grim"){ state.qr.waiting.push({pid, name}); toast(`${name||"Ein Handy"} möchte beitreten. Ordne es unter „Handys verbinden“ einem Platz zu.`); return; }
  if(state.step!=="setup"){ state.step="setup"; }
  ensurePlayers();
  let p = state.players.find(x=>!x.traveller && !x.pid && !x.name.trim());
  if(!p && state.count<15){ state.count++; ensurePlayers(); p = state.players.filter(x=>!x.traveller).slice(-1)[0]; if(p && p.pid) p=null; }
  if(!p){ state.qr.waiting.push({pid, name}); toast(`${name||"Ein Handy"} ist verbunden, aber alle 15 Plätze sind belegt.`); return; }
  p.pid = pid; if(name){ p.name = name; p.phoneName = true; }
}
function qrLink(pid, playerId){
  const p = P(playerId); if(!p) return;
  state.players.forEach(x=>{ if(x.pid===pid) delete x.pid; });
  if(p.pid && p.pid!==pid) state.qr.waiting.push({pid:p.pid, name:net.names[p.pid]||""});
  p.pid = pid; state.qr.waiting = (state.qr.waiting||[]).filter(w=>w.pid!==pid);
  if(!p.name.trim() && net.names[pid]){ p.name = net.names[pid]; p.phoneName = true; }

}
function qrUnlink(playerId){ const p=P(playerId); if(!p || !p.pid) return; if(net.conns[p.pid]) (state.qr.waiting=state.qr.waiting||[]).push({pid:p.pid, name:net.names[p.pid]||""}); delete net.sent[p.pid]; delete p.pid; }
/* Handys, die verbunden sind, aber keinen Platz haben (z. B. nach „Komplett neu“), bekommen in der Einrichtung automatisch einen */
function qrAssignPending(){

  else if(state.step==="grim"){ state.qr.reseat=false; Object.keys(net.conns).forEach(pid=>{ if(state.players.some(x=>x.pid===pid)) return; const p=state.players.find(x=>!x.pid); if(p){ p.pid=pid; delete net.sent[pid]; } else (state.qr.waiting=state.qr.waiting||[]).push({pid, name:net.names[pid]||""}); }); }
}
function qrChanged(full){

/* --- Was ein Handy sehen darf: nur die eigenen Daten, nachts gar nichts --- */
function qrPayload(p){
  const i = idx(p.id);
  const base = {t:"state", ed:ED(), edName:EDITIONS[ED()].name, name:displayName(p,i)};
  if(state.step!=="grim" || !p.role || !R[p.role]) return {...base, phase:"lobby"};
  if(state.phase==="night") return {...base, phase:"night", night:state.night};
  const rid = p.role==="drunk" ? (p.drunkAs || "drunk") : (p.role==="lunatic" && typeof lunAs==="function") ? lunAs() : p.role;
  const r = R[rid] || R[p.role], t = TYPES[r.type];
  const one = ONE_SHOT.includes(rid) ? {name:r.name, used:!!p.abilityUsed} : null;
  return {...base, phase:"day", day:state.night, seat:i+1,
    role:{id:r.id, name:r.name, type:r.type, typeLabel:t.one, color:t.color, typeText:t.text, icon:ICONS[r.icon]||"", text:r.text, tips:((TIPS[r.id]||{}).pl)||[]},
    dead:!!p.dead && !p.zFake, zFake:!!p.zFake, ghostUsed:!!p.ghostUsed, ability:one,
    align: p.traveller ? (p.align==="evil"?"evil":"good") : null, square:qrSquare()};
}
/* Stadtplatz: nur öffentliche Infos (Name, lebt/tot, Geisterstimme, Traveller sind offen bekannt) */
function qrSquare(){
  const L = state.players.map((x,i)=>({n:displayName(x,i), dead:!!x.dead, ghost:!!x.dead && !x.ghostUsed, trav: x.traveller ? (R[x.role]?R[x.role].name:"Traveller") : null, exiled:!!x.exiled}));
  return {need:voteNeed(), alive:state.players.filter(x=>!x.dead).length, ghosts:state.players.filter(x=>x.dead && !x.ghostUsed).length, list:L};
}
/* Skript: alle Rollen der Edition plus Nachtreihenfolge, wie das Rollenblatt am Tisch */
function qrScript(){
  const groups = ["tf","os","mi","de"].map(t=>({label:TYPES[t].label, color:TYPES[t].color, textColor:TYPES[t].text, roles:EROLES(t).map(r=>({name:r.name, icon:ICONS[r.icon]||"", text:r.text}))}));
  if(TRAVL().length) groups.push({label:"Traveller", color:TYPES.tr.color, textColor:TYPES.tr.text, roles:TRAVL().map(id=>({name:R[id].name, icon:ICONS[R[id].icon]||"", text:R[id].text}))});
  const order = first=>nightList(first).filter(id=>!["newimp","travellerinfo"].includes(id) && !(R[id] && R[id].type==="tr")).map(id=>id==="minioninfo"?"Minion-Info":id==="demoninfo"?"Demon-Info":id==="lunaticinfo"?"Lunatic":R[id].name);
  return {t:"script", ed:ED(), edName:EDITIONS[ED()].name, groups, first:order(true), other:order(false)};
}
function qrSync(){
  if(!qrOn() || !net.peer) return;
  Object.entries(net.conns).forEach(([pid,c])=>{
    if(!c.open) return;
    if(net.scriptSent[pid]!==ED()){ try{ c.send(qrScript()); net.scriptSent[pid]=ED(); }catch(e){} }
    const p = state.players.find(x=>x.pid===pid);
    const pl = p ? qrPayload(p) : {t:"state", phase:"wait", name:net.names[pid]||"", edName:EDITIONS[ED()].name, ed:ED()};
    const s = JSON.stringify(pl);
    if(net.sent[pid]===s) return;
    try{ c.send(pl); net.sent[pid]=s; }catch(e){}
  });
}

/* --- Nacht starten / beenden --- */
function startNight(){
  if(state.vote){ commitVote(); state.vote=null; }
  state.night += 1; state.phase = "night"; state.timer = null;
  const dd = (state.diedToday||[]).slice();
  if(isBMR() && state.mm && state.mm.day===state.night-1 && !state.executedToday) toast("Der Mastermind-Tag endet ohne Hinrichtung: Gut gewinnt.");
  state.log[state.night] = {entries:{}, died:[], executed:state.executedToday, dayDeaths:dd,
    outDied: dd.filter(x=>{ const p=P(x); return p && R[p.role] && R[p.role].type==="os"; }),
    gossipTrue: !!(state.gossip && state.gossip.day===state.night-1)};
  state.executedToday = null; state.diedToday = [];
  state.marks = {poison:null, safe:null, safeBroken:false, master:null, triple:null, tripleBroken:false, neg:null, negBroken:false, drunk:[], safeInn:[], innBroken:false, da:null, daBroken:false};
  state.logView = "n"+state.night; ui.ability = null; ui.mayorAsk = false;
  state.curStep = stepList()[0] || null;
  render();
}
function endNight(){
  leaveStep(state.curStep);
  state.phase = "day"; audioUnlock(); startDayTimer(); state.showArrows = !!settings.arrows; state.marks.safe = null; state.marks.safeBroken = false; state.marks.safeInn = []; state.curStep = null; state.logView = "n"+state.night;
  render();
}
function leaveStep(id){
  if(id==="newimp" && cur().entries.newimp) state.pendingImp = null;
  if(id==="travellerinfo"){ const e=cur().entries.travellerinfo; (e && e.list || []).forEach(x=>{ const p=P(x); if(p) p.needsInfo=false; }); }
}
function go(dir){
  const L=stepList(), i=L.indexOf(state.curStep);
  if(dir>0){ leaveStep(state.curStep); if(i>=L.length-1){ endNight(); return; } state.curStep=L[i+1]; }
  else if(i>0) state.curStep=L[i-1];
  render();
}

/* --- Auswahl im Oval --- */
function pickSpec(){
  if(state.phase!=="night" || ui.spy) return null;
  const id=state.curStep;
  if(isBMR()){ const e=E(id); if(asleep(id,e)) return null; return bmrPickSpec(id,e); }
  const s=PICKS[id]; if(!s) return null;
  const e=E(id); if(asleep(id,e)) return null;
  if(id==="librarian" && e.none) return null;
  return s;
}
function onTokenTap(id){
  if(ui.spy) return;
  if(ui.ability && !ui.ability.applied){ ui.ability.picks=[id]; ui.ability.choice=false; render(); return; }
  if(state.vote && state.phase==="day"){ vtrack(()=>voteTap(id)); save(); render(); return; }
  const s = pickSpec();
  if(!s){ openSheet(id); return; }
  const step=state.curStep, e=E(step);
  if(s.self===false && id===e.actor){ toast("Diese Rolle kann sich nicht selbst wählen."); render(); return; }
  if(isBMR() && !e.picks.includes(id)){ const why=bmrTapCheck(s,id,e); if(why){ toast(why); render(); return; } }
  const k=e.picks.indexOf(id);
  if(k>=0) e.picks.splice(k,1);
  else { if(e.picks.length>=s.max) e.picks.shift(); e.picks.push(id); }
  afterPick(step,e);
  save(); render();
}
function afterPick(step,e){
  if(isBMR()){ if(BMR_STATEFUL.has(step)) applyChain(step); return; }
  const t=INFO2[step];
  if(t){ if(!e.role || e.autoRole){ const m=e.picks.map(P).find(p=>p && R[p.role] && R[p.role].type===t); e.role = m ? m.role : (e.autoRole ? "" : e.role); e.autoRole = true; } }
  if(step==="poisoner") state.marks.poison = e.picks[0] || null;
  if(step==="butler") state.marks.master = e.picks[0] || null;
  if(step==="bureaucrat"){ state.marks.triple = e.picks[0] || null; state.marks.tripleBroken = !!fakeWhy(P(e.actor)); }
  if(step==="thief"){ state.marks.neg = e.picks[0] || null; state.marks.negBroken = !!fakeWhy(P(e.actor)); }
  if(step==="monk"){ state.marks.safe = e.picks[0] || null; const a=P(e.actor); state.marks.safeBroken = !!fakeWhy(a); }
  if(step==="imp") applyImp(e);
  if(step==="ravenkeeper"){ const p=P(e.picks[0]); if(p && (!e.role || e.autoRole)){ e.role=p.role; e.autoRole=true; } }
  if(step==="fortuneteller" && !e.manual) e.answer = ftAnswer(e).yes;
}

function stepBody(id){
  const e=E(id), a=P(e.actor);

  e.skipped = !!(a && asleep(id,e));
  if(e.skipped) return head + `<div class="info">${esc(nm(a.id))} ist tot und wird nicht geweckt. Weiter zum nächsten Schritt.</div>`;
  let h = head + (role && id!=="newimp" && id!=="imp" ? warnHTML(a) : "") + `<div class="hinttxt">${HINTS[id]}</div>`;
  const demon = state.players.filter(isDemon), mins = state.players.filter(p=>!p.traveller && R[p.role] && R[p.role].type==="mi");
  if(isBMR() && !["minioninfo","demoninfo","travellerinfo"].includes(id)) return h + bmrStepBody(id,e,a);

  if(id==="travellerinfo"){
    const ts=state.players.filter(p=>p.traveller && p.align==="evil" && !p.dead && (p.needsInfo || (e.list||[]).includes(p.id)));
    e.list = ts.map(p=>p.id); e.done = true;

function showFor(id){

function arrowsFor(n){

function arrowsSVG(list){
  if(!list.length) return {svg:"", labels:""};
  const cols = ["tf","os","mi","de"];
  let paths="", labels="";
  const c = {x:geo.cx, y:geo.cy};
  list.forEach(ar=>{
    const i=idx(ar.from), j=idx(ar.to); if(i<0||j<0) return;
    const p1=slots[i], p2=slots[j], r=geo.d/2+6;
    if(i===j){
      const dx=p1.x-c.x, dy=p1.y-c.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
      const sx=p1.x-ux*r-uy*r*.5, sy=p1.y-uy*r+ux*r*.5, ex=p1.x-ux*r+uy*r*.5, ey=p1.y-uy*r-ux*r*.5, cx2=p1.x-ux*r*2.6, cy2=p1.y-uy*r*2.6;
      paths += `<path d="M${sx},${sy} Q${cx2},${cy2} ${ex},${ey}" style="stroke:${ar.col}" marker-end="url(#ah-${cols.find(t=>TYPES[t].color===ar.col)||"tf"})"/>`;
      if(ar.label) labels += `<div class="alabel" style="left:${p1.x-ux*r*2}px;top:${p1.y-uy*r*2}px;color:${ar.col}">${esc(ar.label)}</div>`;
      return;
    }
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2, q={x:mx+(c.x-mx)*.35, y:my+(c.y-my)*.35};
    const u=(p,q2)=>{ const dx=q2.x-p.x, dy=q2.y-p.y, L=Math.hypot(dx,dy)||1; return {x:dx/L, y:dy/L}; };
    const u1=u(p1,q), u2=u(p2,q);
    const s={x:p1.x+u1.x*r, y:p1.y+u1.y*r}, e={x:p2.x+u2.x*(r+6), y:p2.y+u2.y*(r+6)};
    paths += `<path d="M${s.x},${s.y} Q${q.x},${q.y} ${e.x},${e.y}" style="stroke:${ar.col}" marker-end="url(#ah-${cols.find(t=>TYPES[t].color===ar.col)||"tf"})"/>`;
    if(ar.label){ const lx=.25*s.x+.5*q.x+.25*e.x, ly=.25*s.y+.5*q.y+.25*e.y; labels += `<div class="alabel" style="left:${lx}px;top:${ly}px;color:${ar.col}">${esc(ar.label)}</div>`; }
  });
  const defs = cols.map(t=>`<marker id="ah-${t}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${TYPES[t].color};stroke:none"/></marker>`).join("");
  return {svg:`<svg class="arrows" aria-hidden="true"><defs>${defs}</defs>${paths}</svg>`, labels};
}

/* --- Nominierung, Abstimmung, Hinrichtung, Exil --- */
const isTrav = p=>!!(p && p.traveller);
function voteNeed(){ return Math.ceil(state.players.filter(p=>!p.dead).length/2); }
function exileNeed(){ return Math.ceil(state.players.length/2); }
function voteWeight(id){
  const m=state.marks||{}, alive=r=>state.players.some(p=>p.role===r && !p.dead);
  let w=1;
  if(m.triple===id && !m.tripleBroken && alive("bureaucrat")) w=3;
  if(m.neg===id && !m.negBroken && alive("thief")) w=-w;
  return w;
}
function tally(n){ return n.votes.reduce((s,id)=>s+(n.exile ? 1 : (n.w && n.w[id]!=null ? n.w[id] : 1)),0); }
function blockState(){
  const V=state.vote; let best=null, tie=false, bc=0;
  if(V) V.noms.filter(n=>n.done && !n.virginExec && !n.exile).forEach(n=>{
    const c=tally(n); if(c<n.need) return;
    if(!best || c>bc){ best=n; bc=c; tie=false; } else if(c===bc) tie=true;
  });
  return {best, tie, count:bc};
}
/* Rückgängig: Schnappschüsse des ganzen Abstimmungs-Zustands */
function vsnap(){ return JSON.stringify({players:state.players, vote:state.vote, executedToday:state.executedToday, pendingImp:state.pendingImp, dayLog:state.dayLog, marks:state.marks, diedToday:state.diedToday||[], mm:state.mm||null, minstrel:state.minstrel||null}); }
function vrestore(sn){ const o=JSON.parse(sn); state.players=o.players; state.vote=o.vote; state.executedToday=o.executedToday; state.pendingImp=o.pendingImp; state.dayLog=o.dayLog; state.marks=o.marks; state.diedToday=o.diedToday; state.mm=o.mm; state.minstrel=o.minstrel; ui.toast=null; }
function vtrack(fn){ const before=vsnap(); fn(); if(vsnap()!==before){ (ui.vundo=ui.vundo||[]).push(before); if(ui.vundo.length>80) ui.vundo.shift(); } }
function startVote(){ state.vote = {day:state.night, noms:[], phase:"nominator", draft:{}, vchoice:false, result:null, gunAsked:false, gun:null, gunShot:null, useScape:false}; ui.ability=null; }
function lastNom(){ const V=state.vote; return V && V.noms[V.noms.length-1]; }
const beggarOf = id=>{ const p=P(id); return p && p.role==="beggar" && !p.dead ? p : null; };
function canVote(id,nom){
  const p=P(id); if(!p) return false;
  if(nom.exile || nom.votes.includes(id)) return true;
  if(p.dead) return !p.ghostUsed;
  if(beggarOf(id)) return (p.tokens||0)>0;
  return true;
}
function addVote(nom,id){
  if(nom.votes.includes(id)) return; const p=P(id); if(!p) return;
  nom.votes.push(id);
  if(nom.exile) return;
  nom.w[id]=voteWeight(id);
  if(p.dead){ p.ghostUsed=true; nom.ghostTaken.push(id); }
  else if(beggarOf(id)){ p.tokens=(p.tokens||0)-1; nom.beggarTaken.push(id); }
}
function removeVote(nom,id){
  const k=nom.votes.indexOf(id); if(k<0) return; nom.votes.splice(k,1); if(nom.w) delete nom.w[id];
  const g=nom.ghostTaken.indexOf(id); if(g>=0){ nom.ghostTaken.splice(g,1); if(P(id)) P(id).ghostUsed=false; }
  const b=nom.beggarTaken.indexOf(id); if(b>=0){ nom.beggarTaken.splice(b,1); if(P(id)) P(id).tokens=(P(id).tokens||0)+1; }
}
const gunslinger = ()=>state.players.find(p=>p.role==="gunslinger" && !p.dead);
const snap = ()=>JSON.stringify({players:state.players, pendingImp:state.pendingImp, executedToday:state.executedToday, diedToday:state.diedToday||[]});
function unsnap(s){ const o=JSON.parse(s); state.players=o.players; state.pendingImp=o.pendingImp; state.executedToday=o.executedToday; state.diedToday=o.diedToday; }
function finishNom(nom){
  const V=state.vote; nom.done=true;
  if(nom.exile){ applyExile(nom); V.phase="between"; return; }
  if(!V.gunAsked && gunslinger() && !V.noms.some(n=>n!==nom && n.done && !n.exile && !n.virginExec)){
    V.gunAsked=true; V.gunNom=V.noms.indexOf(nom); V.gun={on:false, target:null}; V.phase="gun"; return;
  }

}
function skipAhead(nom){ while(nom.pos<nom.order.length && !canVote(nom.order[nom.pos],nom)) nom.pos++; if(nom.pos>=nom.order.length) finishNom(nom); }
function applyExile(nom){
  if(tally(nom)<nom.need){ nom.exiled=false; return; }
  const t=P(nom.nominee); if(!t || t.dead) return;
  nom.snap=snap(); kill(t,false); t.exiled=true; nom.exiled=true;
}
function revertExile(nom){ if(nom.snap){ unsnap(nom.snap); nom.snap=null; } nom.exiled=false; }
function applyGun(){
  const V=state.vote; if(!V.gun || !V.gun.on || !V.gun.target) return;
  const gs=gunslinger(), t=P(V.gun.target); if(!gs || !t) return;
  const s=snap(); kill(t,false);
  const d=String(state.night); const L=(state.dayLog[d]=state.dayLog[d]||[]);
  L.push({kind:"gunslinger", actor:gs.id, target:t.id, short:"erschossen", text:`${nm(t.id)} wird erschossen und stirbt.`});
  V.gunShot={snap:s, logIdx:L.length-1};
}
function revertGun(){
  const V=state.vote; if(!V.gunShot) return;
  unsnap(V.gunShot.snap); const L=state.dayLog[String(state.night)]; if(L) L.splice(V.gunShot.logIdx,1);
  V.gunShot=null; ui.toast=null;
}
function createNom(nominator, nominee){
  const V=state.vote, n=state.players.length, i=idx(nominee), ve=P(nominee), ex=isTrav(ve);
  const order=[]; for(let k=1;k<=n;k++) order.push(state.players[(i+k)%n].id);
  const nom={nominator, nominee, exile:ex, votes:[], w:{}, ghostTaken:[], beggarTaken:[], order, pos:0, need: ex?exileNeed():voteNeed(), done:false};
  (ui.vpre=ui.vpre||[])[V.noms.length]=vsnap();
  V.noms.push(nom); V.draft={};
  if(!ex && abilityOf(ve)==="virgin" && !ve.abilityUsed && !ve.dead){ V.phase="virgin"; V.vchoice=false; return; }

}
function virginRes(){ const nom=lastNom(); return abilityResult({id:nom.nominee, picks:[nom.nominator], choice:state.vote.vchoice}); }
function voteTap(id){
  const V=state.vote, p=P(id); if(!p) return;
  if(V.phase==="nominator"){ V.draft={nominator:id}; V.phase="nominee"; save(); render(); return; }
  if(V.phase==="nominee"){
    const nr=P(V.draft.nominator), ex=isTrav(p);
    if(ex){
      if(p.dead){ toast(`${nm(id)} ist schon tot.`); render(); return; }
    } else {
      if(nr.dead){ toast("Tote dürfen nur Traveller zur Verbannung nominieren."); render(); return; }
      if(V.noms.some(n=>!n.exile && n.nominator===nr.id)){ toast(`${nm(nr.id)} hat heute schon nominiert.`); render(); return; }
      if(V.noms.some(n=>!n.exile && n.nominee===id)){ toast(`${nm(id)} wurde heute schon nominiert.`); render(); return; }
    }
    createNom(nr.id, id); save(); render(); return;
  }
  if(V.phase==="gun"){
    if(!V.gun || !V.gun.on){ openSheet(id); return; }
    const nom=V.noms[V.gunNom];
    if(!nom.votes.includes(id) || p.dead){ toast("Der Gunslinger kann nur einen lebenden Spieler wählen, der bei dieser Abstimmung mitgestimmt hat."); render(); return; }
    V.gun.target=id; save(); render(); return;
  }
  if(V.phase==="voting" || V.phase==="between"){
    const nom=lastNom(); if(!nom || nom.virginExec) return;
    if(nom.exile && nom.done){ toast("Die Verbannung ist schon ausgewertet. Mit „Zurück“ kannst du sie korrigieren."); render(); return; }
    if(nom.votes.includes(id)) removeVote(nom,id);
    else if(canVote(id,nom)) addVote(nom,id);
    else { toast(p.dead ? `${nm(id)} ist tot und hat keine Geisterstimme mehr.` : `${nm(id)} (Beggar) hat keine Stimme mehr.`); render(); return; }
    save(); render(); return;
  }
  openSheet(id);
}
function commitVote(){
  const V=state.vote; if(!V || V.committed) return;
  const d=String(V.day); const L=(state.dayLog[d]=state.dayLog[d]||[]);
  V.noms.filter(n=>n.done && !n.virginExec).forEach(n=>L.push(n.exile
    ? {kind:"exile", actor:n.nominator, target:n.nominee, count:tally(n), need:n.need, ok:!!n.exiled, voters:n.votes.slice()}
    : {kind:"nom", actor:n.nominator, target:n.nominee, count:tally(n), need:n.need, voters:n.votes.slice()}));
  if(V.result && V.result.applied && V.result.executed) L.push({kind:"exec", target:V.result.executed, text:V.result.text});
  V.committed=true;
}
function voteResult(){
  const {best,tie,count}=blockState();
  if(tie) return {executed:null, text:"Niemand wird hingerichtet: Gleichstand bei den meisten Stimmen."};
  if(!best) return {executed:null, text:"Niemand wird hingerichtet: Keine Nominierung hat genug Stimmen bekommen."};
  return {executed:best.nominee, text:`${nm(best.nominee)} wird mit ${count} Stimmen hingerichtet.`};
}
const alignOf = p=>evil(p)?"evil":"good";
function scapeFor(execId){
  const x=P(execId); if(!x) return null;
  const sg=state.players.find(p=>p.role==="scapegoat" && !p.dead && p.id!==execId);
  return sg && alignOf(sg)===alignOf(x) ? sg : null;
}
function voteAct(a,v){
  const V=state.vote, nom=lastNom();
  switch(a){
    case "vStart": ui.vstart=vsnap(); ui.vundo=[]; ui.vpre=[]; startVote(); break;
    case "vCancel": if(V.noms.length){ V.phase="between"; V.draft={}; } else state.vote=null; break;
    case "vBackNominator": V.phase="nominator"; V.draft={}; break;
    case "vYes": addVote(nom, nom.order[nom.pos]); nom.pos++; skipAhead(nom); break;
    case "vNo": nom.pos++; skipAhead(nom); break;
    case "vBack": {
      if(V.phase==="between" && V.gunShot && V.gunNom===V.noms.length-1){ revertGun(); V.gun={on:true, target:V.gun?V.gun.target:null}; V.phase="gun"; break; }
      if(V.phase==="gun"){ V.gunAsked=false; V.gun=null; }
      if(nom.exile && nom.exiled) revertExile(nom);
      if(nom.done){ nom.done=false; V.phase="voting"; }
      let k=nom.pos-1; while(k>=0 && !canVote(nom.order[k],nom)) k--;
      if(k>=0){ nom.pos=k; removeVote(nom, nom.order[k]); }
      else { const pre=(ui.vpre||[])[V.noms.length-1], nr=nom.nominator; if(pre){ vrestore(pre); state.vote.phase="nominee"; state.vote.draft={nominator:nr}; } }

    case "vUndo": { const st=ui.vundo||[]; if(st.length) vrestore(st.pop()); return "noTrack"; }
    case "vCancelNom": { const i=V.noms.length-1, pre=(ui.vpre||[])[i]; if(pre){ vrestore(pre); state.vote.phase="nominator"; state.vote.draft={}; } break; }
    case "vRestart": { const i=V.noms.length-1, pre=(ui.vpre||[])[i], n0=V.noms[i]; if(pre && n0){ vrestore(pre); createNom(n0.nominator, n0.nominee); } break; }
    case "vAbort": { if(!ui.vAbortArm){ ui.vAbortArm=true; setTimeout(()=>{ if(ui.vAbortArm){ ui.vAbortArm=false; render(); } }, 4000); return "noTrack"; }
      ui.vAbortArm=false; if(ui.vstart) vrestore(ui.vstart); else state.vote=null; toast("Alle Nominierungen von heute wurden verworfen."); break; }
    case "gOn": V.gun.on = v==="1"; if(!V.gun.on) V.gun.target=null; break;

    case "vMore": V.phase="nominator"; V.draft={}; break;
    case "vEnd": V.phase="result"; V.result=voteResult(); V.useScape=false; break;
    case "vResume": V.phase = V.noms.length ? "between" : "nominator"; V.result=null; break;
    case "vChoice": V.vchoice = v==="1"; break;
    case "vScape": V.useScape = v==="1"; break;
    case "vPac": V.pacSave = v==="1"; break;
    case "vVirgin": {
      const res=virginRes(), ve=P(nom.nominee), nr=P(nom.nominator);
      ve.abilityUsed=true;
      const d=String(state.night); (state.dayLog[d]=state.dayLog[d]||[]).push({kind:"virgin", actor:ve.id, target:nr.id, text:res.text, short:res.short, fake:fakeWhy(ve)});
      if(res.kind==="exec"){ nom.virginExec=true; nom.done=true; V.result={executed:nr.id, virgin:true, text:`${nm(nr.id)} wird durch die Virgin hingerichtet.`}; V.useScape=false; V.phase="result"; }

        const sg=scapeFor(r.executed);
        if(sg && V.useScape){ r.text=`${nm(sg.id)} (Scapegoat) wird statt ${nm(r.executed)} hingerichtet.`; r.saved=r.executed; r.executed=sg.id; }

const WB = {el:null, cv:null, ctx:null, tool:"pen", size:4, dirty:false, confirm:false, last:null};
function openBoard(){
  if(!WB.el){
    WB.el = document.createElement("div");
    WB.el.className = "wb"; WB.el.setAttribute("role","dialog"); WB.el.setAttribute("aria-modal","true"); WB.el.setAttribute("aria-label","Schreibboard");

        </div>

          <button class="wbt primary" data-wb="close">${icon("x")} Schließen</button>
        </div>
      </div>
      <canvas class="wbcv" aria-label="Schreibfläche"></canvas>

    document.body.appendChild(WB.el);
    WB.cv = WB.el.querySelector("canvas"); WB.ctx = WB.cv.getContext("2d");
    WB.size = 6;
    WB.el.querySelectorAll("[data-wb]").forEach(b=>b.addEventListener("click", ()=>wbAct(b.dataset.wb, b)));
    const pos = e=>{ const r=WB.cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    WB.cv.addEventListener("pointerdown", e=>{ WB.cv.setPointerCapture(e.pointerId); WB.last=pos(e); wbDot(WB.last, e); });
    WB.cv.addEventListener("pointermove", e=>{ if(!WB.last) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach(ev=>{ const p=pos(ev); wbLine(WB.last,p,ev); WB.last=p; }); });
    const up = ()=>{ WB.last=null; };
    WB.cv.addEventListener("pointerup", up); WB.cv.addEventListener("pointercancel", up);
    window.addEventListener("resize", ()=>{ if(!WB.el.hidden) wbResize(); });
  }

}
function wbStyle(e){
  const c=WB.ctx, pr = e && e.pressure && e.pointerType==="pen" ? 0.5+e.pressure : 1;

  c.globalCompositeOperation = WB.tool==="eraser" ? "destination-out" : "source-over";
  c.strokeStyle = c.fillStyle = "#f2ead6";

function wbDot(p,e){ wbStyle(e); const c=WB.ctx; c.beginPath(); c.arc(p.x,p.y,c.lineWidth/2,0,Math.PI*2); c.fill(); wbMark(); }

  const cv=WB.cv, dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width===Math.round(w*dpr) && cv.height===Math.round(h*dpr)) return;

  if(cv.width && cv.height) keep.getContext("2d").drawImage(cv,0,0);

  WB.ctx=cv.getContext("2d"); WB.ctx.setTransform(dpr,0,0,dpr,0,0);

function wbAct(a,b){

/* --- Tages-Timer --- */
let actx=null;
function audioUnlock(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(){
  try{ audioUnlock(); if(!actx) return; const t0=actx.currentTime;
    [0,0.35,0.7].forEach(dt=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(0.25,t0+dt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.28);
      o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+0.3); });
  }catch(e){}
}
function tRem(){ const T=state.timer; if(!T) return 0; return T.running ? Math.max(0,(T.endsAt-Date.now())/1000) : T.remaining; }
function fmtT(sec){ const s=Math.ceil(sec), m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,"0")}`; }

function timerHTML(){

    <button class="tt" data-act="tToggle" aria-label="${T.running?"Timer pausieren":"Timer fortsetzen"}"><span id="timerTxt">${r<=0?"Zeit um":fmtT(r)}</span>${icon(T.running?"pause":"play")}</button>

  const r=tRem(), now=Date.now();

  if(a==="tPlus"||a==="tMinus"){ const d=a==="tPlus"?60:-60; T.dur=Math.max(60,T.dur+d); settings.timerSec=T.dur; saveSettings(); const nr=Math.max(0,r+d); if(T.running) T.endsAt=now+nr*1000; else T.remaining=nr; if(nr>0) T.beeped=false; }

}
setInterval(()=>{
  const T=state.timer; if(!T || state.step!=="grim" || state.phase!=="day") return;

  if(rx>240 && ry>150) ["XII","I","II","III","IIII","V","VI","VII","VIII","IX","X","XI"].forEach((s,k)=>{ const ang=-Math.PI/2+k*Math.PI/6; nums+=`<text x="${cx+(rx-26)*Math.cos(ang)}" y="${cy+(ry-24)*Math.sin(ang)}" class="nu">${s}</text>`; });
  const T=state.timer, arc = state.phase==="day" && T && !ui.spy
    ? `<path id="dialArc" class="arc" pathLength="100" d="M${cx},${cy-ry} A${rx},${ry} 0 1,1 ${cx},${cy+ry} A${rx},${ry} 0 1,1 ${cx},${cy-ry}" stroke-dasharray="${Math.max(0,tRem()/T.dur*100).toFixed(2)} 100"/>` : "";
  return `<svg class="dial" aria-hidden="true"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" class="rim"/>${t}${nums}${arc}</svg>`;
}

/* --- Endspiel-Anzeige: wie nah ist Böse am Sieg? --- */
function endgameInfo(){
  if(state.night<1) return null;
  const alive=state.players.filter(p=>aliveOrFake(p) && !p.traveller), n=alive.length, demon=alive.find(isDemon);
  if(isBMR() && state.mm && state.night<=state.mm.day){ return {lvl:"crit", title:"Mastermind: Ein letzter Tag", lines:["Wird an diesem Tag ein Guter hingerichtet, gewinnt Böse. Wird ein Böser oder niemand hingerichtet, gewinnt Gut."]}; }
  if(!demon){ return state.players.some(isDemon) ? {lvl:"good", title:"Der Demon ist tot: Gut gewinnt", lines:[]} : null; }
  if(n<=2) return {lvl:"end", title:"Nur noch 2 leben: Böse gewinnt", lines:[]};
  const day = state.phase==="day";
  const sw = alive.find(p=>p.role==="scarletwoman");
  const mayor = alive.find(p=>p.role==="mayor" && !poisoned(p));
  const lines=[];
  let lvl="ok", title=`Noch ${n-2} Tode bis Böse gewinnt`;
  if(n===3){
    lvl="crit"; title="Finale: Ein Tod noch, dann gewinnt Böse";
    if(day){
      if(state.executedToday) lines.push("Heute wurde schon hingerichtet. Tötet der Demon heute Nacht, gewinnt Böse.");
      else if(mayor) lines.push(`Ohne Hinrichtung gewinnt Gut (Mayor ${nm(mayor.id)}). Wird ein Guter hingerichtet, gewinnt Böse sofort.`);
      else lines.push("Gut muss heute den Demon hinrichten. Wird ein Guter hingerichtet, gewinnt Böse sofort, ohne Hinrichtung spätestens heute Nacht.");
    } else lines.push("Tötet der Demon heute Nacht jemanden, gewinnt Böse.");
  } else if(n===4){
    lvl="warn"; title="Endspiel: Zwei Tode noch bis zum Sieg von Böse";
    lines.push(day ? "Wird heute ein Guter hingerichtet, ist morgen das Finale mit 3 Lebenden. Danach reicht ein Tod in der Nacht." : "Nach dem Kill heute Nacht beginnt morgen das Finale mit 3 Lebenden.");
  } else if(n===5){
    lvl="note"; lines.push("Bei 3 Lebenden beginnt das Finale.");
  }
  if(isBMR()){
    if(demon.role==="shabaloth" && n>=3 && n<=4) lines.push("Der Shabaloth kann in einer Nacht zwei Spieler töten.");
    if(demon.role==="po" && state.poCharged) lines.push("Der Po ist aufgeladen: Heute Nacht können drei sterben.");
    if(demon.zFake) lines.push("Der Zombuul gilt als tot, lebt aber und zählt hier mit.");
    if(alive.some(p=>p.role==="mastermind")) lines.push("Der Mastermind lebt: Stirbt der Demon durch Hinrichtung, folgt noch ein Tag.");
  }
  if(sw) lines.push(n>=5 ? "Scarlet Woman würde beim Tod des Demons übernehmen." : "Scarlet Woman kann nicht mehr übernehmen, es leben weniger als 5.");
  return {lvl, title, lines};
}
function endgameHTML(){
  const e=endgameInfo(); if(!e) return "";
  return `<div class="endg ${e.lvl}" role="status"><b>${esc(e.title)}</b>${e.lines.map(l=>`<span>${esc(l)}</span>`).join("")}</div>`;
}
function afterExecNote(r){
  if(!r || !r.executed) { const alive=state.players.filter(p=>!p.dead).length, mayor=state.players.find(p=>!p.dead && p.role==="mayor" && !poisoned(p));
    return alive===3 && mayor ? "Ohne Hinrichtung bei 3 Lebenden: Gut gewinnt durch den Mayor." : ""; }
  const p=P(r.executed), alive=aliveReg(), after = p.dead || p.traveller ? alive : alive-1;
  if(isBMR()){
    const o=execOutcome(p, false), al2=aliveRegCount();
    if(state.mm && state.night===state.mm.day) return evil(p) ? "Mastermind-Tag: Ein Böser wird hingerichtet, Gut gewinnt." : "Mastermind-Tag: Ein Guter wird hingerichtet, Böse gewinnt.";
    if(o.already) return "Der Spieler ist schon tot.";
    if(o.prot) return `${nm(p.id)} überlebt die Hinrichtung (${o.prot}). Sag nur an, dass hingerichtet wurde.`;
    if(p.role==="zombuul" && !impaired(p) && !p.zUsed) return "Der Zombuul stirbt scheinbar: Tod ansagen, er lebt aber weiter.";
    if(isDemon(p)){ const mm=state.players.find(x=>x.role==="mastermind" && !x.dead && !impaired(x)); return mm ? `Der Demon stirbt, aber der Mastermind (${nm(mm.id)}) lebt: Es folgt noch ein Tag.` : "Der Demon stirbt: Gut gewinnt."; }
    const mn = R[p.role].type==="mi" && state.players.some(x=>x.role==="minstrel" && !x.dead && !impaired(x)) ? " Ein Minion stirbt: Wegen des Minstrels sind danach alle betrunken." : "";
    const aft = p.dead ? al2 : al2-1;
    if(aft<=2) return "Danach leben nur noch 2: Böse gewinnt.";
    return `Danach leben noch ${aft}.${mn}`;
  }
  if(p.role==="imp"){ const sw=state.players.find(x=>!x.dead && x.role==="scarletwoman"); return sw && alive>=5 && !poisoned(sw) ? `Der Demon stirbt. Die Scarlet Woman (${nm(sw.id)}) übernimmt.` : "Der Demon stirbt: Gut gewinnt."; }
  if(p.role==="saint" && !poisoned(p)) return "Das ist der Saint: Böse gewinnt.";
  if(after<=2) return "Danach leben nur noch 2: Böse gewinnt.";
  return `Danach leben noch ${after}.`;
}

function ovalPoints(cx,cy,a,b,n){
  const M=1440, pts=[], cum=[0];
  for(let k=0;k<=M;k++){ const t=-Math.PI/2+k*2*Math.PI/M; pts.push([cx+a*Math.cos(t), cy+b*Math.sin(t)]); if(k) cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1])); }
  const P=cum[M], out=[]; let j=0;
  for(let i=0;i<n;i++){ const L=i*P/n; while(j<M && cum[j+1]<L) j++; const f=(L-cum[j])/((cum[j+1]-cum[j])||1); out.push({x:pts[j][0]+(pts[j+1][0]-pts[j][0])*f, y:pts[j][1]+(pts[j+1][1]-pts[j][1])*f}); }
  return out;
}
function layout(W,H,n){
  let d = Math.min(120, Math.min(W,H)*0.2), g=null;
  for(let it=0; it<60; it++){
    const fs = Math.max(12, Math.min(18, d*0.17));
    const labelH = fs*1.3 + 8 + fs*1.1 + 6 + fs*1.0 + 6;
    const lw = Math.max(d*1.45, d<60 ? 84 : 96);
    const top = d*0.22 + 6;
    const a = Math.max(W/2 - lw/2 - 10, 40), b = Math.max((H - labelH - top)/2 - d/2 - 14, 40);
    const cx = W/2, cy = (H - labelH + top)/2 + 4;
    const pts = ovalPoints(cx,cy,a,b,n);
    const bw = Math.max(d*1.1, lw*0.9), bh = d + labelH + top;
    let ok = true;
    for(let i=0;i<n && ok;i++) for(let k=i+1;k<n;k++){ if(Math.abs(pts[i].x-pts[k].x) < bw && Math.abs(pts[i].y-pts[k].y) < bh){ ok=false; break; } }
    g = {d, a, b, fs, lw, cx, cy, pts};
    if(ok || d<=40) break;
    d *= 0.94;
  }
  return g;
}
