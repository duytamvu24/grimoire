  if(p.role==="beggar" && !p.dead) badges += `<div class="badge trv">Stimmen: ${p.tokens||0}</div>`;
  (o.marks||[]).forEach(m=>{ badges += `<div class="badge mark">${esc(m)}</div>`; });
  return `<div class="tok ${p.dead?"dead":""} ${o.actor?"actor":""} ${o.fake?"fakeact":""} ${o.picked?"picked":""} ${o.dim?"novote":""}" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(displayName(p,i))}${r?", "+esc(r.name):""}"
    style="--d:${geo.d}px;--w:${geo.lw}px;--fs:${geo.fs}px;--c:${t.color};--c-text:${t.text};left:${s.x-geo.lw/2}px;top:${s.y-geo.d/2}px">
    <div class="disc">${r?icon(r.icon):""}</div>${ui.spy?"":togglesHTML(p,i)}
    <div class="nm">${esc(displayName(p,i))}</div>
    <div class="rl">${r?esc(r.name):"keine Rolle"}</div>
    ${badges}
  </div>`;
}
function togglesHTML(p,i){
  const tg = Math.round(Math.max(26, Math.min(46, geo.d*0.4))), cx = geo.lw/2, cy = geo.d/2, rr = geo.d/2 + tg*0.12;
  const pos = a=>`left:${cx+rr*Math.cos(a)-tg/2}px;top:${cy+rr*Math.sin(a)-tg/2}px;width:${tg}px;height:${tg}px`;
  const g = !p.dead ? "na" : p.ghostUsed ? "used" : "avail";
  const gLabel = !p.dead ? "Geisterstimme (erst nach dem Tod)" : p.ghostUsed ? "Geisterstimme verbraucht, tippen zum Zurückgeben" : "Geisterstimme verfügbar, tippen zum Verbrauchen";
  return `<button class="tg tg-dead ${p.dead?"on":""}" data-t="dead" data-id="${p.id}" aria-pressed="${p.dead}" aria-label="${p.dead?"Tot, tippen zum Wiederbeleben":"Als tot markieren"}" style="${pos(-3*Math.PI/4)}">${icon("skull")}</button>`
    + `<button class="tg tg-ghost ${g}" data-t="ghost" data-id="${p.id}" aria-pressed="${p.dead && !p.ghostUsed}" aria-label="${gLabel}" ${p.dead?"":"disabled"} style="${pos(-Math.PI/4)}">${icon("message-circle")}</button>` + abilityBtn(p,pos);
}
function nearestSlot(x,y){
  let best=0, bd=Infinity;
  slots.forEach((s,i)=>{ const d=(s.x-x)**2+(s.y-y)**2; if(d<bd){bd=d;best=i;} });
  return best;
}
function bindDrag(el){
  let start=null, dragging=false, target=-1, hl=null, from=-1, off=null, lp=null, longFired=false;
  const board = document.getElementById("board");
  el.addEventListener("pointerdown", e=>{
    if(e.button>0 || e.target.closest(".tg") || ui.spy) return;
    start = {x:e.clientX, y:e.clientY}; longFired=false; dragging=false; target=-1;
    from = state.players.findIndex(p=>p.id===el.dataset.id);
    const br = board.getBoundingClientRect();
    off = {x: e.clientX - br.left - slots[from].x, y: e.clientY - br.top - slots[from].y};
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    clearTimeout(lp);
    lp = setTimeout(()=>{ if(start && !dragging){ longFired=true; start=null; openSheet(el.dataset.id); } }, 550);
  });
  el.addEventListener("pointermove", e=>{
    if(!start) return;
    if(!dragging && Math.hypot(e.clientX-start.x, e.clientY-start.y) < 16) return;
    clearTimeout(lp);
    if(!dragging){ dragging = true; el.classList.add("dragging"); hl = document.createElement("div"); hl.className="slot-hl"; board.appendChild(hl); }
    const br = board.getBoundingClientRect();
    const x = e.clientX - br.left - off.x, y = e.clientY - br.top - off.y;
    el.style.left = (x - geo.lw/2)+"px"; el.style.top = (y - geo.d/2)+"px";
    target = nearestSlot(x,y);
    const s = slots[target], D = geo.d*1.18;
    Object.assign(hl.style,{left:(s.x-D/2)+"px",top:(s.y-D/2)+"px",width:D+"px",height:D+"px"});
  });
  const end = e=>{
    clearTimeout(lp);
    if(longFired){ longFired=false; return; }
    if(!start) return;
    const wasDrag = dragging, moved = Math.hypot(e.clientX-start.x, e.clientY-start.y);
    start = null; dragging = false; if(hl) hl.remove(); hl = null;
    if(wasDrag){
      if(target>=0 && target!==from){ const L=state.players; [L[from], L[target]] = [L[target], L[from]]; save(); render(); return; }
      render();
      if(moved < 40 && e.type==="pointerup") onTokenTap(el.dataset.id);
    } else if(e.type==="pointerup"){ onTokenTap(el.dataset.id); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("contextmenu", e=>e.preventDefault());
  el.addEventListener("keydown", e=>{ if(e.target===el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); onTokenTap(el.dataset.id); } });
}
function openSheet(id){
  const i = state.players.findIndex(p=>p.id===id), p = state.players[i];
  const r = p.role ? R[p.role] : null, t = r ? TYPES[r.type] : {color:"#6d7290", text:"var(--muted)", one:"Ohne Rolle", good:true};
  const facts = [];
  facts.push(`<div><b>Platz</b> ${i+1}</div>`);
  facts.push(`<div><b>Team</b> ${evil(p)?"Böse":"Gut"}</div>`);
  if(p.role==="beggar") facts.push(`<div><b>Stimmmarken</b> ${p.tokens||0}</div>`);
  if(p.exiled) facts.push(`<div><b>Verbannt</b> durch Exil</div>`);
  if(p.prevRole && R[p.prevRole]) facts.push(`<div><b>Vorher</b> ${esc(R[p.prevRole].name)}</div>`);
  if(p.role==="drunk") facts.push(`<div><b>Glaubt, er ist</b> ${p.drunkAs?esc(R[p.drunkAs].name):"noch nicht festgelegt"}</div>`);
  if(p.role==="fortuneteller"){ const q = state.players.find(x=>x.id===state.redHerring); facts.push(`<div><b>Red Herring</b> ${q?esc(displayName(q,state.players.indexOf(q))):"noch nicht festgelegt"}</div>`); }
  if(state.redHerring===p.id) facts.push(`<div><b>Red Herring</b> erscheint der Fortune Teller als Demon</div>`);
  if(state.marks.poison===p.id) facts.push(`<div><b>Vergiftet</b> bis zur nächsten Abenddämmerung</div>`);
  if(isBMR()) facts.push(...bmrFacts(p));
  if(qrOn()) facts.push(`<div><b>Handy</b> ${connected(p)?"verbunden":p.pid?"getrennt, verbindet sich automatisch neu":"nicht verbunden"}</div>`);
  const gossipBtn = isBMR() && p.role==="gossip" && !p.dead && state.phase==="day" && state.night>=1;
  const gOn = !!(state.gossip && state.gossip.day===state.night);
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Details zu ${esc(displayName(p,i))}" style="--c:${t.color};--c-text:${t.text}">
    <div class="head">
      <div class="disc" style="--d:86px">${r?icon(r.icon):""}</div>
      <div>
        <div class="type">${r?t.one:"Ohne Rolle"}</div>
        <h2>${r?esc(r.name):"Keine Rolle"}</h2>
        <div class="who">${esc(displayName(p,i))}</div>
      </div>
    </div>
    ${r?`<div class="ability">${esc(r.text)}</div>`:""}
    <div class="facts">${facts.join("")}</div>
    ${r && TIPS[r.id]?`<div class="tips">
      <div><h3>Für dich als Erzähler</h3><ul>${TIPS[r.id].st.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h3>Tipps für den Spieler</h3><ul>${TIPS[r.id].pl.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="src">Zusammengefasst nach dem offiziellen Blood-on-the-Clocktower-Wiki.</div>
    </div>`:""}
    <div class="actions">
      <button class="btn ${p.dead?"":"danger"}" id="sDead">${p.dead?"Wiederbeleben":"Als tot markieren"}</button>
      ${p.dead?`<button class="btn" id="sGhost">${p.ghostUsed?"Geisterstimme zurückgeben":"Geisterstimme verbrauchen"}</button>`:""}
      ${p.dead && !p.ghostUsed && p.role!=="beggar" && state.phase==="day" && state.players.some(q=>q.role==="beggar" && !q.dead) ? `<button class="btn" id="sBeg">${icon("hand-coins")} Stimme an Beggar geben</button>` : ""}
      ${gossipBtn ? `<button class="btn ${gOn?"on":""}" id="sGos" aria-pressed="${gOn}">${icon("megaphone")} ${gOn?"Aussage war wahr · tippen zum Zurücknehmen":"Heutige Aussage war wahr"}</button>` : ""}
      ${p.traveller ? `<button class="btn danger" id="sLeave">${icon("user-minus")} Verlässt das Spiel</button>` : ""}
      <button class="btn primary" id="sClose">Schließen</button>
    </div>
  </div>`;
  document.body.appendChild(scrim);
  const close = ()=>{ scrim.remove(); drawBoard(); };
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  scrim.querySelector("#sClose").onclick = close;
  scrim.querySelector("#sClose").focus();
  scrim.querySelector("#sDead").onclick = ()=>{ scrim.remove(); toggle(id,"dead"); };
  const sb = scrim.querySelector("#sBeg"); if(sb) sb.onclick = ()=>{ giveToBeggar(id); save(); scrim.remove(); render(); };
  const sl = scrim.querySelector("#sLeave"); if(sl){ let armed=false; sl.onclick = ()=>{ if(!armed){ armed=true; sl.lastChild.textContent=" Wirklich entfernen?"; return; } removePlayer(id); save(); scrim.remove(); render(); }; }
  const sg2 = scrim.querySelector("#sGos"); if(sg2) sg2.onclick = ()=>{ state.gossip = gOn ? null : {day:state.night}; if(!gOn) toast("Gossip: Heute Nacht wählst du einen Spieler, der stirbt."); save(); scrim.remove(); render(); };
  const g = scrim.querySelector("#sGhost"); if(g) g.onclick = ()=>{ p.ghostUsed = !p.ghostUsed; save(); scrim.remove(); drawBoard(); openSheet(id); };
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ document.removeEventListener("keydown",k); if(scrim.isConnected) close(); } });
}
let rT; window.addEventListener("resize", ()=>{ clearTimeout(rT); rT = setTimeout(()=>{ if(state.step==="grim") drawBoard(); }, 120); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && state.step==="grim") requestWake(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ui.show){ ui.show=null; render(); } if(e.key==="Escape" && ui.qrBig){ ui.qrBig=false; render(); } });
render();
if(qrOn()) qrStart();

</script>
