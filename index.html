<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11131d">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Trouble-Brewing-Grimoire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: ein Nacht-Grimoire. Drei Bildschirme (Anzahl, Spieler, Grimoire); im Grimoire sitzen die Tokens als Pergament-Scheiben im Oval auf dunklem Filz. Bewusst nur dunkel, weil am Spieltisch oft gedimmtes Licht ist. */
:root{
  --night:#11131d;      /* Grund */
  --felt:#1a1e2e;       /* Flächen */
  --felt-2:#232842;     /* erhöhte Flächen */
  --line:#343a5a;
  --ink:#ebe5d6;        /* Text */
  --muted:#a2a7bf;
  --parch:#eadcbd;      /* Token-Scheibe */
  --parch-ink:#2b2418;
  --brass:#cfa54e;      /* Akzent */
  --brass-hi:#ddb764; --brass-lo:#c39441; --on-brass:#1b1408;
  --glow:#1c2135; --board-day:#242a45; --board-night:#1a2349; --board-night-edge:#0c0e1a;
  --tf:#3f74dd;         /* Townsfolk */
  --os:#2a9aa8;         /* Outsider */
  --mi:#d0452f;         /* Minions */
  --de:#a3162a;         /* Demon */
  --ok:#5bb57a;
  --warn:#e2a23b;
  --font-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body,#app{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:.25rem 0 0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:400;font-size:1.5rem;margin:0}
.lead{color:var(--muted);max-width:60ch;margin:.5rem 0 0}

.btn{min-height:52px;padding:0 22px;border-radius:12px;border:1px solid var(--line);background:var(--felt-2);font-weight:700;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--mi);color:#ffb7aa}
.btn svg{width:20px;height:20px}

/* ---------- Bildschirm 1: Anzahl ---------- */
.count-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;margin-top:28px;align-items:start}
@media (max-width:760px){.count-grid{grid-template-columns:1fr}}
.panel{background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:22px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--felt-2);font-size:2rem;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.bignum{font-family:var(--font-display);font-size:6rem;line-height:1;font-variant-numeric:tabular-nums;text-align:center;min-width:2ch}
.bignum small{display:block;font-family:var(--font-body);font-size:1rem;color:var(--muted);letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{min-width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.dist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:520px){.dist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dtile{border-radius:14px;padding:16px 14px;background:var(--felt-2);border-top:5px solid var(--c);display:flex;flex-direction:column;gap:2px}
.dtile b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.dtile span{font-weight:700;color:var(--c-text,var(--ink))}
.dtile small{color:var(--muted)}
.note{margin-top:16px;color:var(--muted);font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;width:20px;height:20px;color:var(--brass);margin-top:2px}
.team-line{display:flex;gap:16px;margin-top:14px;font-weight:700;flex-wrap:wrap}
.team-line .g{color:#9cc0ff}.team-line .e{color:#ff9f8f}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

/* ---------- Bildschirm 2: Spieler ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.counters{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.counter{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--felt);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.counter i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.counter.ok{border-color:var(--ok)}
.counter.over{border-color:var(--warn);color:var(--warn)}
.counter .st{font-weight:500;color:var(--muted);font-size:.9rem}
.counter.ok .st{color:var(--ok)}
.baron-note{margin-top:12px;color:var(--warn);font-weight:500}
.plist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.prow{display:grid;grid-template-columns:44px 44px minmax(0,1fr) minmax(0,1.15fr) 44px;gap:10px 12px;align-items:center;background:var(--felt);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:14px;padding:10px 12px}
.prow .seat{font-family:var(--font-display);font-size:1.5rem;text-align:center;color:var(--muted)}
.mini{width:44px;height:44px;border-radius:50%;background:var(--parch);display:grid;place-items:center;color:var(--c,#8a7f69)}
.mini svg{width:24px;height:24px}
.prow input,.prow select,.sub select{width:100%;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--night);padding:0 12px}
.prow input::placeholder{color:#6d7290}
.sub{grid-column:3 / -1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.sub label{font-weight:700;color:var(--brass);font-size:.95rem}
@media (max-width:640px){
  .prow{grid-template-columns:36px 44px minmax(0,1fr) 44px}
  .prow select.role{grid-column:2 / -1}
  .sub{grid-column:1 / -1;grid-template-columns:1fr}
}
.issues{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--felt);border:1px dashed var(--warn);color:var(--ink)}
.issues ul{margin:.3rem 0 0;padding-left:1.2rem}
.issues.err{border-color:var(--mi)}

/* ---------- Bildschirm 3: Grimoire ---------- */
.grim{height:100%;display:flex;flex-direction:column}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;border-bottom:1px solid var(--line);background:var(--felt)}
.gbar .ttl{font-family:var(--font-display);font-size:1.4rem}
.gbar .btn{min-height:46px;padding:0 16px}
.board{position:relative;flex:1;min-height:420px;overflow:hidden;touch-action:none;
  background:radial-gradient(ellipse at center, #222844 0%, var(--night) 70%)}
.ring{position:absolute;border:1px dashed #3a4166;border-radius:50%;pointer-events:none}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(46%,340px)}
.center .big{font-family:var(--font-display);font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.05}
.center .stats{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap}
.center .stats div{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.center .stats b{font-size:1.7rem;line-height:1.1}
.center .stats span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.center .hint{margin-top:12px;color:var(--muted);font-size:.9rem}
.tok{position:absolute;width:var(--w);display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:left .25s ease, top .25s ease}
.tok.dragging{transition:none;z-index:20;cursor:grabbing}
.tok.dragging .disc{box-shadow:0 14px 30px rgba(0,0,0,.55);transform:scale(1.08)}
.disc{width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(circle at 35% 30%, #f6ecd4, var(--parch) 60%, #d6c49c);border:calc(var(--d)*.06) solid var(--c);display:grid;place-items:center;color:var(--c);position:relative;box-shadow:0 4px 12px rgba(0,0,0,.45);transition:transform .15s}
.disc svg{width:52%;height:52%;stroke-width:1.9}
.tok .nm{margin-top:6px;background:var(--parch);color:var(--parch-ink);font-weight:800;font-size:var(--fs);line-height:1.15;padding:3px 10px;border-radius:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tok .rl{margin-top:3px;font-size:calc(var(--fs)*.82);font-weight:700;color:var(--c-text);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tok .badge{margin-top:3px;font-size:calc(var(--fs)*.72);font-weight:700;padding:1px 8px;border-radius:999px;background:var(--felt-2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tok .badge.rh{border-color:var(--mi);color:#ffb3a6}
.tok.dead .disc{background:#7d776a;border-color:#4a4d5c;color:#2c2a26}.tok.dead .disc svg{opacity:.5}
.tok.dead .nm{text-decoration:line-through;opacity:.75}
.tg{position:absolute;z-index:3;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--felt-2);color:#8a8fa8;box-shadow:0 2px 6px rgba(0,0,0,.45);touch-action:manipulation;transition:background .15s,color .15s,opacity .15s}
.tg svg{width:56%;height:56%}
.tg-dead.on{background:#0b0c12;color:#f4efe2;border-color:#f4efe2}
.tg-ghost.na{opacity:.3;cursor:default}
.tg-ghost.avail{background:#f4f1e8;color:#1a1e2e;border-color:#f4f1e8;box-shadow:0 0 0 4px rgba(244,241,232,.22),0 2px 6px rgba(0,0,0,.45)}
.tg-ghost.used{opacity:.6}
.tg-ab.avail{background:var(--brass);color:var(--on-brass);border-color:var(--brass);box-shadow:0 0 0 4px rgba(207,165,78,.25),0 2px 6px rgba(0,0,0,.45)}
.tg-ab.na{opacity:.3}
.tok.novote .disc{opacity:.35}
.tok .badge.mark.vote{}
.tg-ab.used{opacity:.5}
.tg-ghost.used::after,.tg-ab.used::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:currentColor;transform:rotate(-45deg)}
.slot-hl{position:absolute;border-radius:50%;border:3px solid var(--brass);pointer-events:none;box-shadow:0 0 0 6px rgba(207,165,78,.18)}

/* Detailblatt */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);background:var(--felt);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.sheet .head{display:flex;gap:16px;align-items:center}
.sheet .disc{--d:86px;flex:none}
.sheet .type{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--c-text)}
.sheet h2{font-size:1.9rem;line-height:1.05}
.sheet .who{color:var(--muted);font-weight:700}
.ability{margin-top:16px;font-size:1.08rem;line-height:1.5;padding:14px 16px;background:var(--night);border-radius:12px;border-left:4px solid var(--c)}
.facts{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.facts div{display:flex;gap:8px}
.facts b{color:var(--brass)}
.tips{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.tips{grid-template-columns:1fr}}
.tips h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.tips ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tips .src{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.sheet .actions{margin-top:20px}
@media (prefers-reduced-motion:reduce){.tok,.disc{transition:none}}
/* ---------- Nacht, Protokoll, Pfeile ---------- */
.gbtns{display:flex;gap:10px;flex-wrap:wrap}
.gmain{flex:1;display:flex;min-height:0}
.gmain .board{min-width:0}
.tok{z-index:1}
.npanel{width:clamp(320px,34%,400px);flex:none;border-left:1px solid var(--line);background:var(--felt);overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 16px;display:flex;flex-direction:column;gap:14px}
@media (orientation:portrait), (max-width:820px){
  .gmain{flex-direction:column}
  .npanel{width:auto;border-left:none;border-top:1px solid var(--line);max-height:50%;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
.nhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.nhead .prog{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.nsteps{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.nstep{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.85rem;font-weight:700;min-height:36px}
.nstep .mi,.logl .mi,.bluff .mi{width:28px;height:28px;flex:none;border-radius:50%;background:var(--parch);color:var(--c,#8a7f69);display:grid;place-items:center}
.nstep .mi svg,.logl .mi svg,.bluff .mi svg{width:17px;height:17px}
.nstep.cur{border-color:var(--brass);background:var(--felt-2);box-shadow:inset 0 0 0 1px var(--brass)}
.nstep.done{opacity:.62}
.nstep.skip{opacity:.4;text-decoration:line-through}
.ncard{display:flex;flex-direction:column;gap:12px}
.nwho{display:flex;align-items:center;gap:12px}
.nwho .disc{--d:58px;flex:none}
.nwho .r{font-family:var(--font-display);font-size:1.6rem;line-height:1.05}
.nwho .p{color:var(--muted);font-weight:700}
.hinttxt{background:var(--night);border-left:4px solid var(--brass);padding:12px 14px;border-radius:10px;line-height:1.5}
.warn{background:rgba(208,69,47,.15);border:1px solid var(--mi);color:#ffd2ca;padding:10px 12px;border-radius:10px;font-weight:600;line-height:1.4}
.info{border:1px solid var(--line);padding:10px 12px;border-radius:10px;line-height:1.4}
.info b{color:var(--brass)}
.result{background:var(--felt-2);border:1px solid var(--brass);padding:12px 14px;border-radius:10px;font-weight:700;font-size:1.05rem}
.lbl{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:800}
.picks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--felt-2);border:1px solid var(--brass);font-weight:700}
.pchip.empty{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:500}
.npanel select{width:100%;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--night);padding:0 12px}
.numrow{display:flex;align-items:center;gap:16px}
.numrow button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--felt-2);font-size:1.6rem;line-height:1}
.numrow .n{font-family:var(--font-display);font-size:3rem;min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.yn{display:flex;gap:8px}
.yn button{flex:1;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--felt-2);font-weight:800;font-size:1.05rem}
.yn button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.bluffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bluff{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--night);text-align:left;font-weight:700;min-height:54px}
.bluff small{display:block;color:var(--warn);font-weight:600;font-size:.75rem;line-height:1.2}
.bluff[aria-pressed="true"]{border-color:var(--brass);background:var(--felt-2);box-shadow:inset 0 0 0 1px var(--brass)}
.bluff:disabled{opacity:.4}
.nnav{position:sticky;bottom:0;margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;background:var(--felt);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nnav .btn{flex:1;min-height:52px;padding:0 12px;white-space:nowrap}
.muted{color:var(--muted)}
/* Token-Zustände in der Nacht */
.tok.actor .disc{box-shadow:0 0 0 6px rgba(207,165,78,.6),0 0 28px rgba(207,165,78,.55)}
.tok.picked .disc{outline:4px solid #f4f1e8;outline-offset:4px}
.tok .badge.poison{border-color:#7ac46b;color:#c5efbc}
.tok .badge.safe{border-color:#7fb2ff;color:#d3e3ff}
.tok .badge.master{border-color:var(--brass);color:#f2dca6}
.tok .badge.mark{border-color:#c6b48a;color:var(--parch)}
/* Pfeile */
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.arrows path{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.92}
.alabel{position:absolute;transform:translate(-50%,-50%);background:var(--night);border:1.5px solid currentColor;padding:2px 9px;border-radius:999px;font-size:.82rem;font-weight:800;pointer-events:none;z-index:4;white-space:nowrap}
/* Protokoll */
.lhead{display:flex;flex-direction:column;gap:10px}
.lctl{display:flex;gap:8px}
.lctl select{flex:1}
.btn.sw{min-height:50px;padding:0 14px}
.btn.sw[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.logl{list-style:none;margin:0;padding:0 0 16px;display:flex;flex-direction:column;gap:8px}
.logl li{display:flex;gap:10px;align-items:flex-start;line-height:1.4;padding:8px 10px;border-radius:10px;background:var(--night)}
.logl li b{color:var(--ink)}
.logl .fk{color:#ffb3a6;font-weight:700}
/* Token zeigen */
.showov{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;cursor:pointer;text-align:center}
.showov .disc{--d:min(52vmin,320px)}
.showov .rname{font-family:var(--font-display);font-size:clamp(2.4rem,7vw,4.6rem);line-height:1}
.shownum{font-family:var(--font-display);font-size:min(38vmin,15rem);line-height:1;color:var(--parch)}
.showhint{color:var(--muted)}
.brow{display:flex;gap:min(4vmin,32px);flex-wrap:wrap;justify-content:center}
.bitem{display:flex;flex-direction:column;align-items:center;gap:10px}
.brow .disc{--d:min(26vmin,170px)}
.bname{font-family:var(--font-display);font-size:clamp(1.3rem,3.6vw,2.2rem)}
/* Spy-Ansicht */
.spybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;background:var(--felt);border-bottom:1px solid var(--line)}
.spybar .bl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spybar .bl .mi{width:40px;height:40px;border-radius:50%;background:var(--parch);color:var(--c);display:grid;place-items:center}
.spybar .bl .mi svg{width:24px;height:24px}
.spybar .bl span{font-weight:700}
/* Hinweis unten */
.toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;background:var(--felt-2);border:1px solid var(--brass);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* Schreibboard */
[hidden]{display:none!important}
.wb{position:fixed;inset:0;z-index:80;background:var(--night);display:flex;flex-direction:column}
.wbbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;background:var(--felt);border-bottom:1px solid var(--line)}
.wbtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wbt{min-height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--felt-2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.wbt svg{width:20px;height:20px}
.wbt[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.wbt.sz{padding:0}
.wbt.sz i{display:block;border-radius:50%;background:currentColor}
.wbt.danger{border-color:var(--mi);color:#ffb7aa}
.wbt.primary{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.wbsep{width:1px;height:32px;background:var(--line)}
.wbcv{flex:1;width:100%;min-height:0;display:block;touch-action:none;cursor:crosshair;
  background-image:radial-gradient(circle, #2a3050 1px, transparent 1.2px);background-size:28px 28px}
.wbempty{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);color:var(--muted);font-family:var(--font-display);font-size:clamp(1.4rem,3vw,2rem);pointer-events:none;text-align:center}
body.wb-open{overflow:hidden}
/* ---------- Feinschliff ---------- */
body{background:radial-gradient(ellipse at 50% -10%, var(--glow) 0%, var(--night) 55%)}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 10px rgba(0,0,0,.35)}
.btn{transition:border-color .15s, filter .15s, transform .1s}
.btn:active{transform:translateY(1px)}
.gbar{display:grid;grid-template-columns:auto 1fr auto;background:linear-gradient(180deg,#1e2338,#191d2d);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.gbar > :first-child{justify-self:start}
.gbar .gbtns{justify-self:end}
@media (max-width:1000px){ .gbar{display:flex;flex-wrap:wrap} .gbar .gbtns{margin-left:auto} }
.gcenter{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;min-width:0}
.gbar .gbtns{flex-wrap:nowrap}
@media (max-width:1000px){.gbar .gbtns{flex-wrap:wrap}}
.gbar .ttl{display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.gbar .ttl svg{width:20px;height:20px;color:var(--brass)}
.timer{display:flex;align-items:center;gap:2px;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:3px}
.timer .tb{min-width:42px;height:42px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:800;display:grid;place-items:center}
.timer .tb:hover{color:var(--ink)}
.timer .tb svg{width:18px;height:18px}
.timer .tt{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;border:0;background:var(--felt-2);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums;min-width:118px;justify-content:center}
.timer .tt svg{width:16px;height:16px;opacity:.7}
.timer.paused .tt{color:var(--muted)}
.timer.warn .tt{background:rgba(226,162,59,.18);color:var(--warn)}
.timer.over .tt{background:rgba(208,69,47,.28);color:#ffc0b4;animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 6px rgba(208,69,47,.22)}}
.board.is-day{background:radial-gradient(ellipse at 50% 46%, rgba(207,165,78,.09) 0%, transparent 42%), radial-gradient(ellipse at center, var(--board-day) 0%, var(--night) 72%)}
.board.is-night{background:
  radial-gradient(1.3px 1.3px at 8% 14%, #d5daf5 50%, transparent 52%),
  radial-gradient(1px 1px at 22% 82%, #c2c8ea 50%, transparent 52%),
  radial-gradient(1.6px 1.6px at 37% 9%, #e3e6fa 50%, transparent 52%),
  radial-gradient(1px 1px at 61% 92%, #b9c0e6 50%, transparent 52%),
  radial-gradient(1.3px 1.3px at 79% 12%, #d5daf5 50%, transparent 52%),
  radial-gradient(1px 1px at 93% 41%, #c2c8ea 50%, transparent 52%),
  radial-gradient(1.4px 1.4px at 4% 58%, #cfd4f2 50%, transparent 52%),
  radial-gradient(1px 1px at 88% 78%, #c2c8ea 50%, transparent 52%),
  radial-gradient(1.2px 1.2px at 52% 4%, #d5daf5 50%, transparent 52%),
  radial-gradient(ellipse at center, var(--board-night) 0%, var(--board-night-edge) 76%)}
.dial{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.dial .rim{fill:none;stroke:#2c3254;stroke-width:1}
.dial .tk{stroke:#343b60;stroke-width:1.2}
.dial .tk.big{stroke:#4c5584;stroke-width:2.2}
.dial .nu{fill:#48507c;font-family:var(--font-display);font-size:15px;text-anchor:middle;dominant-baseline:middle}
.dial .arc{fill:none;stroke:var(--brass);stroke-width:3;stroke-linecap:round;opacity:.7;transition:stroke-dasharray .25s linear}
.board.is-night .dial .tk.big{stroke:#3e4778}
.ring{border-color:#353c62}
.disc{box-shadow:inset 0 0 0 calc(var(--d)*.025) rgba(255,255,255,.5), inset 0 calc(var(--d)*-.09) calc(var(--d)*.14) rgba(120,90,40,.22), 0 6px 14px rgba(0,0,0,.5)}
.tok .nm{border:1px solid rgba(60,45,20,.25);letter-spacing:.01em}
.center .big{text-shadow:0 2px 18px rgba(0,0,0,.6)}
.npanel{box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.nwho .disc{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 4px 12px rgba(0,0,0,.45)}
.result{background:linear-gradient(180deg,#262c48,#20253c)}
@media (prefers-reduced-motion:reduce){.timer.over .tt{animation:none}.dial .arc{transition:none}}
.gbar .btn.on{border-color:var(--brass);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}

/* Endspiel-Anzeige */
.center{width:min(52%,380px)}
.endg{margin:12px auto 0;display:flex;flex-direction:column;gap:3px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(17,19,29,.78);font-size:.86rem;line-height:1.35;color:var(--muted);max-width:100%}
.endg b{color:var(--ink);font-size:.95rem}
.endg.note b{color:var(--ink)}
.endg.warn{border-color:var(--warn);background:rgba(60,42,12,.82)}
.endg.warn b{color:var(--warn)}
.endg.crit{border-color:var(--mi);background:rgba(70,18,14,.85);box-shadow:0 0 0 4px rgba(208,69,47,.15)}
.endg.crit b{color:#ffb3a6}
.endg.crit span{color:#f3d3cc}
.endg.end{border-color:var(--de);background:rgba(90,10,22,.9)} .endg.end b{color:#ffc2c9}
.endg.good{border-color:var(--ok);background:rgba(20,60,36,.85)} .endg.good b{color:#bff0cc}
/* Menü */
.menuwrap{position:relative}
.menuscrim{position:fixed;inset:0;z-index:40}
.menu{position:absolute;top:calc(100% + 8px);left:0;z-index:41;min-width:290px;background:var(--felt-2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);display:flex;flex-direction:column}
.mi-item{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:10px;border:0;background:transparent;text-align:left;font-weight:700;font-size:1rem}
.mi-item:hover,.mi-item:focus-visible{background:var(--felt)}
.mi-item svg{width:20px;height:20px;color:var(--brass);flex:none}
.mi-item.danger{color:#ffb7aa}.mi-item.danger svg{color:#ffb7aa}
.msep{height:1px;background:var(--line);margin:4px 6px}
.btn[aria-expanded="true"]{border-color:var(--brass);color:var(--brass)}
/* Vollbild-Seiten */
.page{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;background:linear-gradient(180deg,#1e2338,#191d2d);border-bottom:1px solid var(--line)}
.pbar h2{font-size:1.8rem}
.pbody{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(40px + env(safe-area-inset-bottom,0px))}
.pinner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:50px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:800}
.tab[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.tcard{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.tcard h3{font-family:var(--font-display);font-weight:400;font-size:1.5rem;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.tcard h3 svg{width:22px;height:22px;color:var(--brass)}
.tcard ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.tcard.big ul{font-size:1.18rem}
.rhead{font-family:var(--font-display);font-weight:400;font-size:1.7rem;margin:0 0 12px;padding-left:12px;border-left:5px solid var(--c)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.rcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-content:start;background:var(--felt);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:14px}
.rcard .disc{--d:56px}
.rcard .rn{font-family:var(--font-display);font-size:1.4rem;line-height:1.1}
.rcard .inplay{font-size:.8rem;font-weight:800;color:var(--brass);margin-top:2px}
.rcard .ab{line-height:1.45;margin-top:6px}
.rcard details{grid-column:1/-1}
.rcard summary{cursor:pointer;font-weight:800;color:var(--brass);min-height:40px;display:flex;align-items:center}
.rcard .tips{margin-top:4px;grid-template-columns:1fr}
.rgrid{align-items:start}
.slist{display:flex;flex-direction:column;gap:12px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:var(--felt);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.srow .t{min-width:0;flex:1}
.srow .t b{display:block;font-size:1.08rem}
.srow .t span{color:var(--muted)}
.srow .numrow .n small{font-family:var(--font-body);font-size:1rem;color:var(--muted)}
.switch{width:66px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--night);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.switch[aria-pressed="true"]{background:rgba(207,165,78,.25);border-color:var(--brass)}
.switch[aria-pressed="true"]::after{left:32px;background:var(--brass)}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}

/* Traveller */
:root{--trv:#9b6cd6}
.trow{border-left-color:var(--trv)}
.trow .sub{grid-template-columns:auto minmax(0,1fr) auto}
.trow .sub .yn button{min-height:46px}
.trow .sub .btn{min-height:46px;padding:0 12px}
.trow .sub .btn svg{width:18px;height:18px}
.travadd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.tok .badge.trv{border-color:var(--trv);color:#e2d2fb}
.tok .badge.al.good{border-color:#5a8ee6;color:#cfe0ff}
.tok .badge.al.evil{border-color:var(--mi);color:#ffc0b4}
.ainput,.asel{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--night);padding:0 12px;min-width:min(260px,100%)}

/* Auffällige Warnung Gift / Drunk */
.alarm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:14px 16px;border-radius:14px;
  background:linear-gradient(135deg,#8a1f13,#4c0f0a);border:2px solid #ff6a52;color:#fff1ec;box-shadow:0 0 0 4px rgba(255,106,82,.18),0 8px 22px rgba(0,0,0,.35);animation:alarmglow 1.6s ease-in-out infinite}
.alarm .ai{width:46px;height:46px;border-radius:50%;background:#ffefe9;color:#a3241a;display:grid;place-items:center}
.alarm .ai svg{width:26px;height:26px}
.alarm b{display:block;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.alarm span{line-height:1.4}
@keyframes alarmglow{50%{box-shadow:0 0 0 8px rgba(255,106,82,.28),0 8px 22px rgba(0,0,0,.35)}}
.nstep.fake{border-color:#ff6a52;box-shadow:inset 0 0 0 1px #ff6a52}
.nstep.fake::after{content:"!";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ff6a52;color:#2a0905;font-weight:900;font-size:.75rem;margin-left:2px}
.tok.fakeact .disc{box-shadow:0 0 0 6px rgba(255,106,82,.85),0 0 30px rgba(255,106,82,.6)!important}
.tok .badge.alarmb{background:#c4321f;border-color:#ff8a76;color:#fff;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.alarm{animation:none}}
.scrim{z-index:75}
.toast{z-index:90}

/* Einrichtung: Spieler entfernen */
.pdel{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#ffb7aa;display:grid;place-items:center;padding:0}
.pdel svg{width:18px;height:18px}
.pdel:disabled{opacity:.3}
/* Spielerliste */
.plist2{display:flex;flex-direction:column;gap:8px}
.plrow{display:grid;grid-template-columns:36px 52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;background:var(--felt);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;cursor:pointer}
.plrow:hover{border-color:var(--brass)}
.plrow .seat{font-family:var(--font-display);font-size:1.4rem;color:var(--muted);text-align:center}
.plrow .disc{--d:52px}
.plrow .pt{display:flex;flex-direction:column;min-width:0}
.plrow .pt b{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow .rn{color:var(--c-text);font-weight:700}
.plrow .tg2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.plrow .tg2 i{font-style:normal;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.plrow.dead .disc{background:#7d776a;border-color:#4a4d5c;color:#2c2a26}
.plrow.dead .pt b{text-decoration:line-through;opacity:.75}
.sw2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:74px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--felt-2);font-size:.78rem;font-weight:800;color:var(--muted)}
.sw2 svg{width:20px;height:20px}
.sw2.dead.on{background:#0b0c12;color:#f4efe2;border-color:#f4efe2}
.sw2.ghost.avail{background:#f4f1e8;color:#1a1e2e;border-color:#f4f1e8}
.sw2.ghost.na{opacity:.35}
.sw2.ghost.used{opacity:.6}
@media (max-width:560px){ .plrow{grid-template-columns:44px minmax(0,1fr) auto auto} .plrow .seat{display:none} .sw2{min-width:60px} }
/* Regeln */
.tgrid.rules .tcard ul{font-size:1.05rem}
.rtbl{margin-top:12px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.rtbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rtbl th,.rtbl td{padding:6px 12px;text-align:left;border-bottom:1px solid var(--line)}
.rtbl th{position:sticky;top:0;background:var(--felt-2);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}

/* Testmodus */
.testbox{margin-top:32px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;padding:20px 22px;border-radius:18px;border:1px dashed var(--brass);background:rgba(207,165,78,.06)}
@media (max-width:760px){.testbox{grid-template-columns:1fr}}
.testbox h2{margin-top:4px}
.testbox p{margin:.4rem 0 0;max-width:60ch}
.testctl{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.testctl .chips{margin-top:0}
.testtag{margin-left:10px;font-family:var(--font-body);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px dashed var(--brass);color:var(--brass)}

/* Abstimmung: Rückgängig und Abbrechen */
.vtools{display:flex;flex-wrap:wrap;gap:6px}
.vt{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--night);font-weight:700;font-size:.88rem}
.vt svg{width:16px;height:16px;color:var(--brass)}
.vt:disabled{opacity:.35}
.vt.danger{color:#ffb7aa}.vt.danger svg{color:#ffb7aa}

/* Editionen: Auswahl und Farbwelten */
:root[data-ed="bmr"]{--night:#140b0e;--felt:#22131a;--felt-2:#2f1a23;--line:#4c2b35;--muted:#bba3aa;--brass:#e0713f;--brass-hi:#ec8c5e;--brass-lo:#c55a2d;--on-brass:#210904;--glow:#2c141b;--board-day:#3a1d25;--board-night:#2e0f18;--board-night-edge:#0e0608}
:root[data-ed="sv"]{--night:#100d1a;--felt:#1c1730;--felt-2:#272043;--line:#3f3566;--muted:#aca4c8;--brass:#b98af0;--brass-hi:#cba4f6;--brass-lo:#9a68e0;--on-brass:#170a2a;--glow:#221a3c;--board-day:#2e2652;--board-night:#211a48;--board-night-edge:#0a0814}
.edpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
@media (max-width:700px){.edpick{grid-template-columns:1fr}}
.edcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px 18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--felt);border-top:5px solid var(--edc);min-height:96px;transition:border-color .15s, transform .15s}
.edcard:hover{transform:translateY(-1px)}
.edcard.on{border-color:var(--edc);box-shadow:0 0 0 2px var(--edc), 0 10px 28px rgba(0,0,0,.35);background:var(--felt-2)}
.edcard .edname{font-family:var(--font-display);font-size:1.45rem;line-height:1.1;color:var(--ink)}
.edcard .edsub{color:var(--muted);font-weight:700;font-size:.9rem}
.edcard .soon{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px dashed var(--edc);color:var(--edc)}
.edtext{margin-top:14px}
h2.sec{font-size:1.7rem;margin-top:30px}
.soonbox{margin-top:28px;padding:28px;border-radius:18px;border:1px dashed var(--brass);background:linear-gradient(135deg, rgba(255,255,255,.03), transparent);text-align:left}
.soonbox h2{font-size:1.9rem;margin-top:10px}
.soonbox p{max-width:60ch;color:var(--muted);line-height:1.55}
.soonbadge{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--brass);color:var(--on-brass)}
.namechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.namechips span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:.9rem}
.soon{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px dashed var(--brass);color:var(--brass);margin-right:6px}
.qroption{margin-top:24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 22px;border-radius:18px;border:1px solid var(--line);background:var(--felt)}
.qroption p{margin:.4rem 0 0;max-width:62ch}
.qroption h2{margin-top:4px}
.qrbox{margin:18px 0;display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:22px;align-items:start;padding:20px;border-radius:18px;border:1px solid var(--brass);background:var(--felt)}
@media (max-width:700px){.qrbox{grid-template-columns:1fr}}
.qrbox h2{margin:2px 0 10px}
.qrbox p{margin:.6rem 0}
.qrcode{background:#fff;border-radius:14px;padding:10px;aspect-ratio:1;display:grid;place-items:center;cursor:zoom-in;max-width:300px;width:100%}
.qrcode svg{width:100%;height:100%;display:block}
.qrph{display:grid;place-items:center;gap:10px;text-align:center;color:#555;padding:14px;font-size:.95rem}
.qrph svg{width:56px;height:56px}
.qrstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qrstat i{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.qrstat.online i{background:var(--ok);box-shadow:0 0 0 4px rgba(91,181,122,.2)}
.qrstat.connecting i{background:var(--warn)}
.qrstat.error i{background:var(--mi)}
.qrstat span{color:var(--muted)}
.qrlinktxt{font-size:.85rem;color:var(--muted);word-break:break-all;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.qrurl{display:grid;gap:6px;margin-top:14px}
.qrurl label{font-weight:700}
.qrurl .ainput{width:100%}
.qrwait,.qrplist{display:grid;gap:8px}
.qrwrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qrwrow svg,.phone svg{width:18px;height:18px;vertical-align:-3px}
.qrprow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.qrprow .btn{min-height:38px;padding:0 12px}
.phone{color:var(--line)}
.phone.has{color:var(--muted)}
.phone.on{color:var(--ok)}
.prow .seat{position:relative}
.prow .seat .phone{position:absolute;right:-4px;bottom:-8px;font-size:0}
.qrbig{position:fixed;inset:0;z-index:80;background:rgba(5,6,12,.92);display:grid;place-items:center;align-content:center;gap:18px;padding:16px;cursor:zoom-out}
.qrbigcode{background:#fff;border-radius:18px;padding:16px;width:min(78vh,90vw);aspect-ratio:1}
.qrbigcode svg{width:100%;height:100%;display:block}
.qrbighint{color:var(--ink);font-size:1.1rem;text-align:center}
</style>

    pl:["Nimm einem verdächtigen Spieler die Stimme weg.","Wählen Bureaucrat und Thief denselben Spieler, zählt seine Stimme minus drei."]},

    pl:["Der bestätigte Townsfolk ist ein guter Verbündeter, um den herum sich das Spiel aufbauen lässt.","Hältst du die Info bis spät zurück, kannst du gezielt einen Spieler als Imp ausschließen."]},

  slayer:{st:["Trifft er den lebenden Demon, stirbt dieser. Sonst verkündest du, dass nichts passiert.","Der Recluse kann als Demon gelten und sterben. Behandle einen bluffenden Slayer genauso wie einen echten."],

    pl:["Lieber spät verraten, dass du Mayor bist.","Vor dem Verzicht auf eine Hinrichtung sicher sein, dass du nicht der Drunk bist und die Poisoner tot ist."]},
  butler:{st:["Markiere jede Nacht seinen Herrn. Er darf nur abstimmen, wenn sein Herr schon die Hand gehoben hat.","Stimmt er versehentlich falsch ab, zähl die Stimme trotzdem und kläre es danach unter vier Augen."],

  drunk:{st:["Leg statt des Drunk ein Townsfolk-Token in den Beutel. Der Spieler hält sich für diesen Townsfolk.","Weck ihn wie den Townsfolk, für den er sich hält, und gib ihm ruhig falsche Infos."],

  spy:{st:["Weck den Spy jede Nacht und zeig ihm das Grimoire, so lange er braucht.","Bei Fähigkeiten, die nach Guten suchen, entscheidest du, wie er erscheint. Er kann als Townsfolk oder Outsider gelten."],

    pl:["Behaupte selbst, ein Outsider zu sein. Das verwirrt die Zählung.","Lass dich als Ablenkung hinrichten, um dem Demon einen Tag zu schenken."]},

const TEST_NAMES = ["Anna","Ben","Clara","David","Emma","Finn","Greta","Hannes","Ida","Jonas","Klara","Leo","Mia","Noah","Olga","Paul","Rosa","Simon","Tara","Uwe","Vera","Willi"];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randomRoles(count){
  const [tf0,os0,mi,de] = DIST[count];
  const minions = shuffle(EROLES("mi").map(r=>r.id)).slice(0,mi);
  let tf=tf0, os=os0, gfMod=null; if(minions.includes("baron")){ tf-=2; os+=2; }
  if(minions.includes("godfather")){ gfMod = os===0 || Math.random()<0.5 ? 1 : -1; tf-=gfMod; os+=gfMod; }
  const pick = (t,n)=>shuffle(EROLES(t).map(r=>r.id)).slice(0,n);
  return {roles: shuffle([...pick("tf",tf), ...pick("os",os), ...minions, ...pick("de",de)]), gfMod};
}
function assignRandom(players){
  const regs = players.filter(p=>!p.traveller);
  const {roles, gfMod} = randomRoles(regs.length);
  if(gfMod) state.gfMod = gfMod;
  regs.forEach((p,i)=>{ p.role=roles[i]; p.drunkAs=""; delete p.lunAs; delete p.align; });
  const dmn = regs.find(p=>R[p.role].type==="de"), lun = regs.find(p=>p.role==="lunatic");
  if(lun && dmn) lun.lunAs = dmn.role;
  const inPlayNow = new Set(regs.map(p=>p.role));
  const drunk = regs.find(p=>p.role==="drunk");
  if(drunk) drunk.drunkAs = shuffle(EROLES().filter(r=>r.type==="tf" && !inPlayNow.has(r.id)).map(r=>r.id))[0] || "";
  let rh = null;
  if(regs.some(p=>p.role==="fortuneteller")){ const good = regs.filter(p=>TYPES[R[p.role].type].good); rh = shuffle(good)[0].id; }
  return rh;
}
function makeTestGame(count, nTrav){
  const names = shuffle(TEST_NAMES);
  const players = [];
  for(let i=0;i<count;i++) players.push({id:uid(), name:names[i], role:"", drunkAs:"", dead:false, ghostUsed:false});
  const trav = shuffle(TRAVL()).slice(0, nTrav);
  trav.forEach((r,k)=>{ const evilT = Math.random()<0.3; players.push({id:uid(), name:names[count+k], role:r, traveller:true, align:evilT?"evil":"good", needsInfo:evilT, drunkAs:"", dead:false, ghostUsed:false}); });
  const ordered = shuffle(players);
  const ed = state.edition, qr = state.qr ? {room:state.qr.room, waiting:[], reseat:true} : null;
  state = {step:"grim", count, players:ordered, redHerring:null, test:true, testTrav:nTrav, edition:ed, qr};
  state.redHerring = assignRandom(ordered);
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||""}</svg>`; }
function displayName(p,i){ return p.name.trim() || `Spieler ${i+1}`; }

function ensurePlayers(){
  const reg=()=>state.players.filter(p=>!p.traveller);
  while(reg().length < state.count) state.players.push({id:uid(), name:"", role:"", drunkAs:"", dead:false, ghostUsed:false});
  while(reg().length > state.count){ const last=[...state.players].reverse().find(p=>!p.traveller); state.players.splice(state.players.indexOf(last),1); }
  if(state.redHerring && !state.players.some(p=>p.id===state.redHerring)) state.redHerring = null;
}
function gfMod(){ const m = state.gfMod===-1 ? -1 : 1; return (m===-1 && DIST[state.count][1]===0) ? 1 : m; }
function needed(){
  const d = [...DIST[state.count]];
  if(state.players.some(p=>p.role==="baron")){ d[0]-=2; d[1]+=2; }
  if(state.players.some(p=>p.role==="godfather")){ const m=gfMod(); d[0]-=m; d[1]+=m; }
  return {tf:d[0], os:d[1], mi:d[2], de:d[3]};
}
function counts(exceptId){
  const c = {tf:0,os:0,mi:0,de:0};
  state.players.forEach(p=>{ if(p.id!==exceptId && p.role && !p.traveller) c[R[p.role].type]++; });
  return c;
}
function isGood(p){ return !p.role || (p.traveller ? p.align!=="evil" : TYPES[R[p.role].type].good); }

function render(){
  const app = document.getElementById("app");
  document.documentElement.dataset.ed = ED();
  if(state.step==="setup"){ ensurePlayers(); qrAssignPending(); app.innerHTML = setupHTML(); bindSetup(); }
  else if(state.step==="grim"){
    ensurePlayers(); G(); qrAssignPending();
    const sd=document.getElementById("side"), sy = sd ? sd.scrollTop : 0;
    app.innerHTML = grimHTML(); bindGrim();
    const sd2=document.getElementById("side"); if(sd2) sd2.scrollTop = sy;
  }
  else { app.innerHTML = countHTML(); bindCount(); }
  if(ui.qrBig && qrOn()){ app.insertAdjacentHTML("beforeend", qrBigHTML()); bindQr(app.querySelector(".qrbig")); }
  save();
}

function bindCount(){

  const set = n=>{ state.count = Math.max(5,Math.min(15,n)); render(); };
  document.getElementById("minus").onclick = ()=>set(state.count-1);
  document.getElementById("plus").onclick = ()=>set(state.count+1);
  document.querySelectorAll(".chip[data-n]").forEach(b=>b.onclick=()=>set(+b.dataset.n));
  if(!EDITIONS[ED()].ready) return;
  document.getElementById("next").onclick = ()=>{ state.step="setup"; render(); window.scrollTo(0,0); };
  document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{ state.testTrav=+b.dataset.tn; render(); });
  document.getElementById("mkTest").onclick = ()=>{ const ed=ED(); state.edition=ed; makeTestGame(state.count, TRAVL().length ? (state.testTrav||0) : 0); state.edition=ed; render(); window.scrollTo(0,0); };
  const g = document.getElementById("toGrim"); if(g) g.onclick = ()=>{ state.step="grim"; render(); };
  document.getElementById("qrPlay").onclick = ()=>{ qrEnable(); state.step = state.players.some(p=>p.role) && state.step==="grim" ? "grim" : "setup"; render(); window.scrollTo(0,0); };
}

/* ---------- Bildschirm 2 ---------- */
function roleOptions(p){
  const need = needed(), have = counts(p.id);
  const taken = new Map();
  state.players.forEach((q,i)=>{
    if(q.id===p.id) return;
    if(q.role) taken.set(q.role, `vergeben an ${displayName(q,i)}`);
    if(q.role==="drunk" && q.drunkAs) taken.set(q.drunkAs, "Drunk glaubt, er ist das");
  });
  const groups = ORDER.map(t=>{
    const full = have[t] >= need[t];
    const roles = EROLES(t);
    const free = roles.filter(r=>!taken.has(r.id)), used = roles.filter(r=>taken.has(r.id));
    const opts = free.map(r=>`<option value="${r.id}" ${p.role===r.id?"selected":""}>${esc(r.name)}${full && p.role!==r.id?" (Anzahl erreicht)":""}</option>`).join("")
      + used.map(r=>`<option value="${r.id}" disabled>${esc(r.name)} – ${esc(taken.get(r.id))}</option>`).join("");
    return {full, html:`<optgroup label="${TYPES[t].label} · ${have[t]} von ${need[t]}${full?" – voll":""}">${opts}</optgroup>`};
  });
  // empfohlene Gruppen zuerst, volle ans Ende
  const sorted = [...groups.filter(g=>!g.full), ...groups.filter(g=>g.full)];
  return `<option value="" ${!p.role?"selected":""}>Rolle wählen…</option>` + sorted.map(g=>g.html).join("");
}
function drunkOptions(p){
  const inPlay = new Set(state.players.map(q=>q.role));
  const otherBeliefs = new Set(state.players.filter(q=>q.id!==p.id && q.drunkAs).map(q=>q.drunkAs));
  const opts = EROLES("tf").map(r=>{
    const blocked = inPlay.has(r.id) || otherBeliefs.has(r.id);
    return `<option value="${r.id}" ${p.drunkAs===r.id?"selected":""} ${blocked && p.drunkAs!==r.id?"disabled":""}>${esc(r.name)}${blocked?" – im Spiel":""}</option>`;
  }).join("");
  return `<option value="">Townsfolk wählen, der nicht im Spiel ist…</option>${opts}`;
}
function herringOptions(){
  const opts = state.players.map((q,i)=>{
    const evil = !isGood(q) || q.traveller;
    return `<option value="${q.id}" ${state.redHerring===q.id?"selected":""} ${evil?"disabled":""}>Platz ${i+1} · ${esc(displayName(q,i))}${q.role?` (${esc(R[q.role].name)})`:""}${q.traveller?" – Traveller":evil?" – böse":""}</option>`;
  }).join("");
  return `<option value="">Guten Spieler wählen…</option>${opts}`;
}
function issues(){
  const errs = [], warns = [];
  const missing = state.players.map((p,i)=>!p.role?i+1:null).filter(Boolean);
  if(missing.length) errs.push(`Noch ohne Rolle: Platz ${missing.join(", ")}`);
  const need = needed(), have = counts();
  ORDER.forEach(t=>{ if(have[t]!==need[t] && !missing.length) warns.push(`${TYPES[t].label}: ${have[t]} vergeben, laut Aufstellung ${need[t]}`); });
  const drunk = state.players.find(p=>p.role==="drunk");
  if(drunk && !drunk.drunkAs) warns.push("Beim Drunk fehlt noch, für wen er sich hält.");
  if(state.players.some(p=>p.role==="fortuneteller") && !state.redHerring) warns.push("Für die Fortune Teller ist noch kein Red Herring gewählt.");
  return {errs, warns};
}
function issuesHTML(){
  const {errs,warns} = issues();
  if(!errs.length && !warns.length) return "";
  return `<div class="issues ${errs.length?"err":""}" id="issues"><b>${errs.length?"Bevor es losgeht":"Hinweis"}</b><ul>${[...errs,...warns].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
function travRowHTML(p,i){
  const r = p.role ? R[p.role] : null, used=new Set(state.players.filter(q=>q.id!==p.id).map(q=>q.role));
  const opts = `<option value="">Traveller wählen…</option>` + TRAVL().map(t=>`<option value="${t}" ${p.role===t?"selected":""} ${used.has(t)?"disabled":""}>${R[t].name}${used.has(t)?" – vergeben":""}</option>`).join("");
  return `<div class="prow trow" style="--c:var(--trv)">
    <span class="seat">${i+1}</span>
    <span class="mini">${r?icon(r.icon):icon("user-plus")}</span>
    <input id="name-${p.id}" data-name="${p.id}" value="${esc(p.name)}" placeholder="Name des Travellers" autocomplete="off" enterkeyhint="next">
    <select id="trole-${p.id}" class="role" data-trole="${p.id}" aria-label="Traveller-Rolle">${opts}</select>

  const rows = state.players.map((p,i)=>{

    if(p.role==="lunatic"){ const dm=state.players.find(q=>R[q.role] && R[q.role].type==="de"); if(!p.lunAs) p.lunAs = dm ? dm.role : "pukka";
      sub = `<div class="sub"><label for="lun-${p.id}">Glaubt, er ist</label><select id="lun-${p.id}" data-lun="${p.id}">${EROLES("de").map(r=>`<option value="${r.id}" ${p.lunAs===r.id?"selected":""}>${esc(r.name)}${dm&&dm.role===r.id?" – der echte Demon":""}</option>`).join("")}</select></div>`; }
    if(p.role==="fortuneteller") sub = `<div class="sub"><label for="rh-${p.id}">Red Herring</label><select id="rh-${p.id}" data-rh="1">${herringOptions()}</select></div>`;
    return `<div class="prow" style="${c?`--c:${c}`:""}">

    const freeT = shuffle(TRAVL().filter(r=>!state.players.some(p=>p.role===r)));
    state.players.forEach(p=>{ if(p.traveller && !p.role) p.role = freeT.shift() || ""; });
    const y=window.scrollY; render(); window.scrollTo(0,y);
  };
  document.getElementById("addPl").onclick = ()=>{ if(state.count>=15) return; state.count++; const y=window.scrollY; render(); window.scrollTo(0,y); };
  document.querySelectorAll("[data-pdel]").forEach(b=>{ b.onclick=()=>{
    if(state.count<=5) return;
    const k=state.players.findIndex(p=>p.id===b.dataset.pdel); if(k<0) return;
    if(state.redHerring===b.dataset.pdel) state.redHerring=null;

  document.getElementById("addTrav").onclick = ()=>{

  };
  document.querySelectorAll("[data-trole]").forEach(sel=>{ sel.onchange=()=>{ byId(sel.dataset.trole).role=sel.value; const y=window.scrollY; render(); window.scrollTo(0,y); }; });
  document.querySelectorAll("[data-talign]").forEach(b=>{ b.onclick=()=>{ const p=byId(b.dataset.talign); p.align=b.dataset.v; p.needsInfo = p.align==="evil"; const y=window.scrollY; render(); window.scrollTo(0,y); }; });
  document.querySelectorAll("[data-tdel]").forEach(b=>{ b.onclick=()=>{ const k=state.players.findIndex(p=>p.id===b.dataset.tdel); if(k>=0) state.players.splice(k,1); const y=window.scrollY; render(); window.scrollTo(0,y); }; });
  document.querySelectorAll("[data-role]").forEach(sel=>{
    sel.onchange = ()=>{
      const p = byId(sel.dataset.role); p.role = sel.value;
      if(p.role!=="drunk") p.drunkAs = "";
      if(p.role!=="lunatic") delete p.lunAs;
      if(!state.players.some(q=>q.role==="fortuneteller")) state.redHerring = null;
      if(state.redHerring && !isGood(byId(state.redHerring))) state.redHerring = null;
      const y=window.scrollY; render(); window.scrollTo(0,y);
    };
  });
  document.querySelectorAll("[data-gf]").forEach(b=>{ b.onclick=()=>{ state.gfMod=+b.dataset.gf; const y=window.scrollY; render(); window.scrollTo(0,y); }; });
  document.querySelectorAll("[data-lun]").forEach(sel=>{ sel.onchange=()=>{ byId(sel.dataset.lun).lunAs=sel.value; save(); }; });
  document.querySelectorAll("[data-drunk]").forEach(sel=>{
    sel.onchange = ()=>{ byId(sel.dataset.drunk).drunkAs = sel.value; const y=window.scrollY; render(); window.scrollTo(0,y); };
  });
  document.querySelectorAll("[data-rh]").forEach(sel=>{
    sel.onchange = ()=>{ state.redHerring = sel.value || null; const y=window.scrollY; render(); window.scrollTo(0,y); };
  });
  document.querySelectorAll("[data-name]").forEach(inp=>{ const f=inp.oninput; inp.oninput=()=>{ const p=byId(inp.dataset.name); if(p) p.phoneName=false; f(); }; });
  bindQr(document.getElementById("qrBox"));
}
